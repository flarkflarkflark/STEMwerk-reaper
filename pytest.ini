[pytest]
markers =
    portable: deterministic test with fully controlled inputs (mocks/fixtures only); safe for CI on any machine -- no managed-runtime, hardware, or ambient-environment discovery. Opt-in so unmarked tests stay out of portable CI until deliberately classified.
    simulated_publication_adapter: simulated native publication API behavior; does not qualify a host platform or filesystem.
    native_publication: exercises the current host's native no-replace publication path with controlled assets.
