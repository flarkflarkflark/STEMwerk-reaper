# ============================================================================
# STEMwerk — macOS Apple Silicon backend smoke
# ============================================================================
# Target branch: ci/macos-apple-silicon-backend-smoke (post-v2.2.2.1)
#
# PURPOSE
#   Validate that the v2.2.2.1 dependency hotfix (torch==2.5.1 pin) holds on
#   a real macOS arm64 runner, and that all required imports work.
#
# WHAT THIS WORKFLOW IS
#   - An Apple Silicon backend/dependency smoke test
#   - A regression guard against torch>=2.6 sneaking back in via resolver drift
#   - Manual-only (workflow_dispatch) for now; push-trigger to be added later
#
# WHAT THIS WORKFLOW IS NOT
#   - A guarantee of MPS acceleration on the hosted runner
#   - A REAPER GUI test
#   - A separation correctness/quality test
#
# WHY MPS IS NOT HARD-ASSERTED
#   GitHub-hosted macOS runners use Apple Virtualization Framework. MPS may
#   not be exposed to the guest VM even when the host chip is M1. Asserting
#   torch.backends.mps.is_available() == True would cause false-red builds.
#   Strict MPS validation belongs in a future self-hosted real-Mac workflow.
#
# HARD ASSERTIONS (will fail the build):
#   - platform.machine() == "arm64"
#   - torch == 2.5.1 and <2.6
#   - torchaudio == 2.5.1 and matches torch
#   - audio-separator == 0.23.0
#   - stemwerk-core installs and imports
#   - onnxruntime imports (silicon or standard)
#   - torch wheel was built with MPS support
#
# INFORMATIONAL (printed, never failing):
#   - torch.backends.mps.is_available()
#   - stemwerk_core.select_device("auto") return value
# ============================================================================

name: macOS Apple Silicon backend smoke

on:
  workflow_dispatch:  # manual-only for now; add push: trigger later

jobs:
  apple-silicon-backend:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      # ── machine info — confirm we're really on arm64 ────────────────────────
      - name: Show machine
        run: |
          uname -a
          uname -m
          sysctl -n machdep.cpu.brand_string || true
          sw_vers
          python3 --version
          python3 -c "import platform; print('machine:', platform.machine())"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── pre-flight: stemwerk-core path must exist ───────────────────────────
      # If this fails, the install path in the next step is wrong and pip
      # would error with a confusing message. Fail fast with a clear one.
      - name: Verify stemwerk-core path
        run: |
          STEMWERK_CORE_PATH="./scripts/reaper/vendor/stemwerk-core"
          if [ ! -f "${STEMWERK_CORE_PATH}/pyproject.toml" ]; then
            echo "::error::stemwerk-core pyproject.toml not found at ${STEMWERK_CORE_PATH}"
            echo "::error::Confirm the actual repo layout before running this workflow."
            exit 1
          fi
          echo "stemwerk-core path OK: ${STEMWERK_CORE_PATH}"

      # ── venv + deps in correct order (torch FIRST, force-reinstall LAST) ────
      # This mirrors the v2.2.2.1 bootstrap install sequence exactly so CI
      # validates the same resolver path users hit.
      - name: Create venv and install backend deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip

          # 1. torch FIRST — pinned <2.6 to avoid Demucs weights_only crash
          pip install "torch==2.5.1" "torchaudio==2.5.1"

          # 2. base scientific stack
          pip install "numpy<2" soundfile

          # 3. stemwerk-core
          pip install ./scripts/reaper/vendor/stemwerk-core

          # 4. audio-separator — pinned 0.23.0 for v2.2.2.1
          pip install audio-separator==0.23.0

          # 5. force-reinstall torch as safety net (resolver may have drifted)
          pip install --force-reinstall --no-deps "torch==2.5.1" "torchaudio==2.5.1"

          # 6. onnxruntime: silicon first, then pinned standard
          pip install onnxruntime-silicon \
            || pip install "onnxruntime>=1.21,<1.22"

          # pytest for the regression test step
          pip install pytest

      # ── REGRESSION TESTS — fail loud on dependency drift ────────────────────
      # All hard assertions live in tests/test_dependency_constraints.py.
      # This shows up as a distinct check on the PR page, separate from the
      # informational MPS step below.
      - name: Dependency constraints regression tests
        run: |
          . .venv/bin/activate
          pytest tests/test_dependency_constraints.py -v --tb=short

      # ── INFORMATIONAL: MPS runtime + selected device ────────────────────────
      # These steps PRINT only — they never fail the build. Strict MPS
      # validation belongs in a self-hosted Mac workflow.
      - name: Print MPS runtime info (informational)
        run: |
          . .venv/bin/activate
          python - <<'PY'
          import torch
          print("torch:", torch.__version__)
          print("mps built:", torch.backends.mps.is_built())
          print("mps available:", torch.backends.mps.is_available())
          if not torch.backends.mps.is_available():
              print("note: MPS unavailable on GitHub-hosted runner is expected")
              print("      due to Apple Virtualization Framework limitations,")
              print("      not a regression. Strict check requires self-hosted Mac.")
          PY

      - name: Print stemwerk_core select_device (informational)
        run: |
          . .venv/bin/activate
          python - <<'PY'
          from stemwerk_core import select_device

          device_id, device_name = select_device("auto")
          print(f"stemwerk_core select_device('auto'): id={device_id!r} name={device_name!r}")
          if device_id != "mps":
              print("note: device_id != 'mps' on GitHub-hosted runner is expected;")
              print("      cpu fallback is not a regression.")
          PY

      # ── FINAL: print remaining versions for log clarity ─────────────────────
      - name: Print remaining versions
        run: |
          . .venv/bin/activate
          python - <<'PY'
          import torchaudio
          print("torchaudio:", torchaudio.__version__)

          import audio_separator
          print("audio_separator import: ok")

          import onnxruntime as ort
          print("onnxruntime:", ort.__version__)
          print("onnxruntime providers:", ort.get_available_providers())
          PY
