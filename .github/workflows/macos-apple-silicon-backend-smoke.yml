name: macOS Apple Silicon backend smoke

on:
  push:
    branches:
      - ci/macos-apple-silicon-backend-smoke
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

jobs:
  apple-silicon-backend:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show runner diagnostics
        env:
          RUNNER_OS_CONTEXT: ${{ runner.os }}
          RUNNER_ARCH_CONTEXT: ${{ runner.arch }}
          RUNNER_NAME_CONTEXT: ${{ runner.name }}
        run: |
          echo "runner.os=${RUNNER_OS_CONTEXT}"
          echo "runner.arch=${RUNNER_ARCH_CONTEXT}"
          echo "runner.name=${RUNNER_NAME_CONTEXT}"
          uname -a
          uname -m
          sw_vers
          python3 --version
          python3 - <<'PY'
          import platform
          import sys

          print(f"python_executable={sys.executable}")
          print(f"sys_platform={sys.platform}")
          print(f"python_version={platform.python_version()}")
          print(f"platform_system={platform.system()}")
          print(f"platform_platform={platform.platform()}")
          print(f"platform_machine={platform.machine()}")
          PY

      - name: Verify vendored stemwerk-core bundle
        run: |
          test -f scripts/reaper/vendor/stemwerk-core/pyproject.toml

      - name: Install Lua runtime for Lua guard tests
        run: |
          if ! command -v lua >/dev/null 2>&1 || ! command -v luac >/dev/null 2>&1; then
            brew update
            brew install lua
          fi
          lua -v
          luac -v

      - name: Create venv and install backend smoke dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -c scripts/reaper/constraints/macos.txt "numpy==2.4.4" "soundfile>=0.12.1"
          pip install "torch==2.5.1" "torchvision==0.20.1" "torchaudio==2.5.1"
          pip install ./scripts/reaper/vendor/stemwerk-core
          pip install "audio-separator==0.44.3"
          pip install --force-reinstall --no-deps "samplerate==0.2.4"
          pip install --force-reinstall --no-deps "numpy==2.4.4" "torch==2.5.1" "torchvision==0.20.1" "torchaudio==2.5.1"
          pip install "onnxruntime==1.27.0"
          python scripts/reaper/_internal/stemwerk_samplerate_guard.py --validate-only --repair-version 0.2.4
          pip check 2>&1 | tee /tmp/stemwerk-pip-check.log || true
          grep -Eiq '^audio-separator 0\.44\.3 has requirement samplerate==0\.1\.0, but you have samplerate 0\.2\.4\.?$' /tmp/stemwerk-pip-check.log
          test "$(grep -Eivc '^[[:space:]]*$|^audio-separator 0\.44\.3 has requirement samplerate==0\.1\.0, but you have samplerate 0\.2\.4\.?$' /tmp/stemwerk-pip-check.log)" -eq 0
          pip install pytest

      - name: Show backend smoke dependency diagnostics
        run: |
          . .venv/bin/activate
          python - <<'PY'
          import json
          import platform
          import sys
          from importlib.metadata import version

          import audio_separator
          import onnxruntime
          import stemwerk_core
          import torch
          import torchvision
          import torchaudio

          payload = {
              "sys_platform": sys.platform,
              "platform_system": platform.system(),
              "platform_machine": platform.machine(),
              "platform_platform": platform.platform(),
              "python_executable": sys.executable,
              "python_version": platform.python_version(),
              "torch_version": torch.__version__,
              "torchvision_version": torchvision.__version__,
              "torchaudio_version": torchaudio.__version__,
              "audio_separator_version": version("audio-separator"),
              "onnxruntime_version": onnxruntime.__version__,
              "mps_built": torch.backends.mps.is_built(),
              "mps_available": torch.backends.mps.is_available(),
              "audio_separator_import": audio_separator.__name__,
              "stemwerk_core_import": stemwerk_core.__name__,
          }
          print("SMOKE_DIAGNOSTICS_JSON=" + json.dumps(payload, sort_keys=True))
          PY

      - name: Run dependency smoke pytest
        run: |
          . .venv/bin/activate
          pytest tests/test_dependency_constraints.py -v --tb=short -s
