name: CI Fast

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Validate version sync
        run: python tools/version_sync.py --check

      - name: Run release gate
        run: python tools/release_gate.py --check

      - name: Install test dependencies
        run: |
          python -m pip install pytest pyyaml soundfile

      - name: Quick script smoke tests
        run: |
          # lightweight invocation that doesn't require heavy ML stacks
          python scripts/reaper/audio_separator_process.py --list-models
          python scripts/reaper/audio_separator_process.py --help

      - name: Test i18n completeness
        run: |
          python tests/i18n/test_languages.py
          if [ $? -ne 0 ]; then
            echo "Language file validation failed"
            exit 1
          fi

      - name: Run curated fast pytest coverage
        run: |
          python -m pytest -q \
            tests/test_device_normalization.py \
            tests/test_macos_mps_fallback.py \
            tests/test_model_registry_schema.py \
            tests/test_windows_normal_route_matrix.py \
            tests/test_vocals_hq_runtime_proof.py \
            tests/test_dependency_constraints.py::test_ci_fast_quick_script_smoke_installs_pyyaml \
            tests/test_dependency_constraints.py::test_ci_fast_runs_curated_pytest_coverage \
            tests/test_dependency_constraints.py::test_no_stale_onnxruntime_ci_pins
