name: CI Fast

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Validate version sync
        run: python tools/version_sync.py --check

      - name: Run release gate
        run: python tools/release_gate.py --check

      - name: Install test dependencies
        run: |
          python -m pip install pytest pyyaml soundfile jsonschema

      - name: Quick script smoke tests
        run: |
          # lightweight invocation that doesn't require heavy ML stacks
          python scripts/reaper/audio_separator_process.py --list-models
          python scripts/reaper/audio_separator_process.py --help

      - name: Run release-relevant pytest suite
        run: |
          python -m pytest -q \
            tests/test_release_gate.py \
            tests/test_b0_model_preflight.py \
            tests/test_b0_small_model_descriptor_2310.py \
            tests/test_2310_run_context_identity.py \
            tests/test_2310_diagnostics_truthfulness.py \
            tests/test_project_context_targeting.py \
            tests/test_dks_extract_import_invariants.py \
            tests/test_windows_payload_contract_2306.py \
            tests/test_linux_package_portability_2306.py \
            tests/test_macos_intel_dks_diagnostics_2306.py \
            tests/test_2306_narrow_hotfix.py \
            tests/test_workflow_contracts.py \
            tests/test_runtime_resolution.py \
            tests/test_normal_stems_authoritative_contract_gate.py \
            tests/test_dks_authoritative_contract_gate.py \
            tests/test_drum_kit_capability_probe.py \
            tests/test_linux_drumsep_rocm_fallback_chain.py \
            tests/i18n/test_languages.py

      - name: Run portable runtime diagnostics harness tests
        # Only the opt-in @pytest.mark.portable subset: fully controlled
        # inputs, no managed-runtime/hardware discovery. The real-* tests
        # require this repo's bootstrapped managed runtime and actual
        # hardware and stay runnable separately, outside portable CI.
        run: >-
          python -m pytest -q -m portable
          tests/test_stemwerk_runtime_diagnostics_harness.py
          tests/test_core_readiness.py
          tests/test_core_readiness_hardening.py
          tests/test_core_catalog_sync.py
          tests/test_dependency_constraints.py::test_audio_separator_process_consumes_shared_managed_ffmpeg_candidates

      - name: Test i18n completeness
        run: |
          python tests/i18n/test_languages.py
          if [ $? -ne 0 ]; then
            echo "Language file validation failed"
            exit 1
          fi

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Run Lua workflow contract tests
        run: |
          lua5.4 tests/lua/test_workflow_contracts.lua
          lua5.4 tests/lua/test_runtime_authority.lua
