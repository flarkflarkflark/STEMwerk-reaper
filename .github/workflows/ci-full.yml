name: CI Fast

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-managed-python-bootstrap:
    name: Linux managed Python bootstrap
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Obtain and verify the pinned Linux archive for deterministic fixtures
        shell: bash
        run: |
          archive="$RUNNER_TEMP/stemwerk-python-linux.tar.gz"
          curl --fail --location --proto '=https' --proto-redir '=https' --max-redirs 5 --output "$archive" \
            'https://github.com/astral-sh/python-build-standalone/releases/download/20261026/cpython-3.12.16%2B20261026-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz'
          printf '%s  %s\n' 'ce4f6d0a6cfdb3bed6e44c2f9affd85943c76a42e25ad3a259002f31d6fb8a20' "$archive" | sha256sum -c -
          test "$(wc -c < "$archive")" -eq 34505639
          echo "STEMWERK_TEST_PINNED_PYTHON_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Prepare ubuntu:24.04 Docker image for dash namespace test
        # test_a_proc_view_of_another_pid_namespace_releases_nothing_under_dash
        # inspects a local ubuntu:24.04 image and never pulls implicitly.
        shell: bash
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            echo "docker CLI is not available on PATH for $(id -un) (uid=$(id -u))" >&2
            exit 1
          fi
          if ! docker image inspect ubuntu:24.04 >/dev/null 2>&1; then
            if ! docker pull ubuntu:24.04; then
              echo "failed to pull ubuntu:24.04 Docker image as $(id -un) (uid=$(id -u))" >&2
              exit 1
            fi
          fi
          if ! err="$(docker image inspect ubuntu:24.04 2>&1 >/dev/null)"; then
            echo "docker image inspect ubuntu:24.04 failed under pytest user $(id -un) (uid=$(id -u)): ${err}" >&2
            exit 1
          fi
          echo "ubuntu:24.04 Docker image ready for $(id -un) (uid=$(id -u))"
      - name: Run Linux outer-bootstrap contract tests
        run: python -m pytest -q --junitxml=linux-managed-python-bootstrap-junit.xml tests/test_linux_managed_bootstrap.py
      - name: Require that the real GNU Wget hangup regression ran and passed
        # pytest exits 0 when this test skips for a missing GNU Wget or openssl,
        # so a skip must not look like a pass.
        shell: python
        run: |
          import sys
          import xml.etree.ElementTree as ET

          report = "linux-managed-python-bootstrap-junit.xml"
          name = "test_hangup_during_real_wget_download_is_a_contained_cancellation"
          try:
              root = ET.parse(report).getroot()
          except (OSError, ET.ParseError) as exc:
              sys.exit(f"{name}: cannot read JUnit report {report}: {exc}")
          cases = [case for case in root.iter("testcase") if case.get("name") == name]
          if len(cases) != 1:
              sys.exit(f"{name}: expected exactly one testcase in {report}, found {len(cases)}")
          outcomes = [
              f"{child.tag}: {child.get('message', '')}"
              for child in cases[0]
              if child.tag in ("skipped", "error", "failure")
          ]
          if outcomes:
              sys.exit(f"{name}: did not pass: {'; '.join(outcomes)}")
          print(f"{name}: ran once and passed")
      - name: Require that the Linux bootstrap selection really ran
        # pytest --collect-only -q tests/test_linux_managed_bootstrap.py gives
        # this count; raise it when tests are added. A deselected or removed
        # test must not pass silently. Skips are tolerated in the aggregate
        # count only because the optional-dependency tests have their own
        # named guards above or below.
        shell: python
        run: |
          import sys
          import xml.etree.ElementTree as ET

          minimum = 63
          report = "linux-managed-python-bootstrap-junit.xml"
          bootstrap_file = "tests/test_linux_managed_bootstrap.py"
          bootstrap_class = "tests.test_linux_managed_bootstrap"
          required_names = (
              "test_a_proc_view_of_another_pid_namespace_releases_nothing_under_dash",
          )
          try:
              root = ET.parse(report).getroot()
          except (OSError, ET.ParseError) as exc:
              sys.exit(f"cannot read JUnit report {report}: {exc}")
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          if root.tag not in ("testsuite", "testsuites") or not suites:
              sys.exit(f"cannot read JUnit report {report}: missing testsuite")
          try:
              totals = {
                  key: sum(int(suite.get(key, 0)) for suite in suites)
                  for key in ("tests", "errors", "failures")
              }
          except ValueError as exc:
              sys.exit(f"cannot read JUnit report {report}: {exc}")
          for name in required_names:
              cases = [
                  case
                  for case in root.iter("testcase")
                  if case.get("name") == name
                  and case.get("file") in (None, bootstrap_file)
                  and (
                      case.get("classname") == bootstrap_class
                      or (case.get("file") == bootstrap_file and not case.get("classname"))
                  )
              ]
              if len(cases) != 1:
                  sys.exit(
                      f"{bootstrap_class}::{name}: expected exactly one testcase in {report}, found {len(cases)}"
                  )
              outcomes = [
                  f"{child.tag}: {child.get('message', '')}"
                  for child in cases[0]
                  if child.tag in ("skipped", "error", "failure")
              ]
              if outcomes:
                  sys.exit(f"{bootstrap_class}::{name}: did not pass: {'; '.join(outcomes)}")
              print(f"{bootstrap_class}::{name}: ran once and passed")
          print(totals, "minimum", minimum)
          if totals["tests"] < minimum or totals["errors"] or totals["failures"]:
              sys.exit("the Linux bootstrap selection did not all execute and pass")
      - name: Real entry-point smoke into a fresh runner-owned root
        shell: bash
        run: |
          /bin/sh scripts/reaper/STEMwerk_Bootstrap_Linux.sh --managed-python-bootstrap \
            --root "$RUNNER_TEMP/stemwerk-bootstrap-smoke" -- plan --module drum_kit > "$RUNNER_TEMP/stemwerk-bootstrap-plan.json"
          python -c 'import json,os; p=os.environ["RUNNER_TEMP"]+"/stemwerk-bootstrap-plan.json"; assert json.load(open(p))["kind"] == "stemwerk_module_install_plan"'
          /bin/sh scripts/reaper/STEMwerk_Bootstrap_Linux.sh --managed-python-bootstrap \
            --root "$RUNNER_TEMP/stemwerk-bootstrap-smoke" -- plan --module drum_kit --scope s6_cpu > "$RUNNER_TEMP/stemwerk-bootstrap-s6-plan.json"
          python -c 'import json,os; p=os.environ["RUNNER_TEMP"]+"/stemwerk-bootstrap-s6-plan.json"; d=json.load(open(p)); assert d["kind"] == "stemwerk_module_install_plan" and d["scope"] == "s6_cpu"'

  tests:
    # The 3.11 entry keeps the exact name `tests`, the required check on main;
    # the 3.12 entry (managed runtime version, D2) is named `tests (3.12)`.
    name: ${{ matrix.python-version == '3.11' && 'tests' || format('tests ({0})', matrix.python-version) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python and OpenSSL versions
        # This job is pinned to ubuntu-24.04 for its OpenSSL 3.0.x; the step
        # fails if the runner's Python links another OpenSSL series.
        env:
          REQUIRED_OPENSSL_SERIES: "3.0"
        shell: python
        run: |
          import os
          import platform
          import ssl
          import sys

          print("Python:", sys.version)
          print("Platform:", platform.platform())
          print("OpenSSL:", ssl.OPENSSL_VERSION)
          required = os.environ.get("REQUIRED_OPENSSL_SERIES", "")
          if required:
              actual = "%d.%d" % ssl.OPENSSL_VERSION_INFO[:2]
              if actual != required:
                  sys.exit(
                      f"expected OpenSSL {required}.x on this runner, found "
                      f"{ssl.OPENSSL_VERSION}. The ubuntu-24.04 jobs keep "
                      "OpenSSL 3.0.x coverage on purpose: socket races in "
                      "asset acquisition surfaced only with it. Keep this "
                      "runner on 3.0.x; observe newer OpenSSL in a separate "
                      "matrix entry."
                  )

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Validate version sync
        run: python tools/version_sync.py --check

      - name: Run release gate
        run: python tools/release_gate.py --check

      - name: Install test dependencies
        run: |
          python -m pip install pytest pyyaml soundfile jsonschema

      - name: Quick script smoke tests
        run: |
          # lightweight invocation that doesn't require heavy ML stacks
          python scripts/reaper/audio_separator_process.py --list-models
          python scripts/reaper/audio_separator_process.py --help

      - name: Run release-relevant pytest suite
        run: |
          python -m pytest -q \
            tests/test_release_gate.py \
            tests/test_b0_model_preflight.py \
            tests/test_b0_small_model_descriptor_2310.py \
            tests/test_2310_run_context_identity.py \
            tests/test_2310_diagnostics_truthfulness.py \
            tests/test_project_context_targeting.py \
            tests/test_dks_extract_import_invariants.py \
            tests/test_windows_payload_contract_2306.py \
            tests/test_linux_package_portability_2306.py \
            tests/test_macos_intel_dks_diagnostics_2306.py \
            tests/test_2306_narrow_hotfix.py \
            tests/test_workflow_contracts.py \
            tests/test_runtime_resolution.py \
            tests/test_normal_stems_authoritative_contract_gate.py \
            tests/test_dks_authoritative_contract_gate.py \
            tests/test_drum_kit_capability_probe.py \
            tests/test_linux_drumsep_rocm_fallback_chain.py \
            tests/i18n/test_languages.py

      - name: Ensure unprivileged user and PID namespaces for portable bootstrap tests
        # tests/test_core_install_bootstrap.py probes
        # `unshare --user --map-root-user --pid --fork --mount-proc true` as the
        # non-root pytest user. Ubuntu 24.04 hosted runners enable
        # kernel.apparmor_restrict_unprivileged_userns=1 by default, blocking
        # that unprivileged route unless relaxed for this ephemeral runner job.
        shell: bash
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            echo "refusing to run portable namespace probe as root (uid=0)" >&2
            exit 1
          fi
          if ! command -v unshare >/dev/null 2>&1; then
            echo "unshare is not available on PATH for $(id -un) (uid=$(id -u))" >&2
            exit 1
          fi
          probe=(unshare --user --map-root-user --pid --fork --mount-proc true)
          if ! err="$("${probe[@]}" 2>&1)"; then
            echo "initial unprivileged namespace probe failed as $(id -un) (uid=$(id -u)): ${err}" >&2
            if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = "1" ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
            if [ "$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null)" = "0" ]; then
              sudo sysctl -w kernel.unprivileged_userns_clone=1
            fi
            if ! err="$("${probe[@]}" 2>&1)"; then
              echo "unprivileged namespace probe still failed as $(id -un) (uid=$(id -u)) after sysctl remedy: ${err}" >&2
              exit 1
            fi
          fi
          echo "unprivileged user + PID namespace probe passed as $(id -un) (uid=$(id -u))"

      - name: Run portable runtime diagnostics harness tests
        # Only the opt-in @pytest.mark.portable subset: fully controlled
        # inputs, no managed-runtime/hardware discovery. The real-* tests
        # require this repo's bootstrapped managed runtime and actual
        # hardware and stay runnable separately, outside portable CI.
        run: >-
          python -m pytest -q -rs -m portable
          --junitxml=portable-junit.xml
          tests/test_stemwerk_runtime_diagnostics_harness.py
          tests/test_core_drumsep_runtime.py
          tests/test_core_readiness.py
          tests/test_core_readiness_hardening.py
          tests/test_core_installation_plan.py
          tests/test_core_asset_materialization.py
          tests/test_core_asset_acquisition.py
          tests/test_core_asset_preparation.py
          tests/test_core_module_verify.py
          tests/test_core_module_install.py
          tests/test_core_install_preflight.py
          tests/test_core_install_events.py
          tests/test_core_cli_encoding.py
          tests/test_core_process_identity.py
          tests/test_core_install_lock.py
          tests/test_core_install_journal.py
          tests/test_core_runtime_manifest.py
          tests/test_core_managed_python.py
          tests/test_core_install_bootstrap.py
          tests/test_core_s6_linux_install.py
          tests/test_core_s7_linux_ffmpeg.py
          tests/test_core_s8_cancel.py
          tests/test_core_catalog_sync.py
          tests/test_dependency_constraints.py::test_audio_separator_process_consumes_shared_managed_ffmpeg_candidates

      - name: Require that the Core S8 cancellation cases really ran
        # The portable selection above includes tests/test_core_s8_cancel.py
        # and the six real foreign-namespace regressions in
        # tests/test_core_install_bootstrap.py; if those cases were dropped or
        # skipped the job would still pass.
        # pytest --collect-only -q -m portable tests/test_core_s8_cancel.py
        # gives the S8 file count; raise it when cancellation tests are added.
        # This job runs on Linux only, so the POSIX cases do not skip here.
        shell: python
        run: |
          import sys
          import xml.etree.ElementTree as ET

          minimum = 86
          report = "portable-junit.xml"
          s8_file = "tests/test_core_s8_cancel.py"
          s8_class = "tests.test_core_s8_cancel"
          bootstrap_file = "tests/test_core_install_bootstrap.py"
          bootstrap_class = "tests.test_core_install_bootstrap"
          required_foreign_ns_cases = (
              "test_fix4_REAL_foreign_namespace_retry_keeps_a_live_writers_core_staging[missing]",
              "test_fix4_REAL_foreign_namespace_retry_keeps_a_live_writers_core_staging[recorded]",
              "test_fix4_REAL_foreign_namespace_stale_cleanup_keeps_a_live_writers_bootstrap_staging[empty]",
              "test_fix4_REAL_foreign_namespace_stale_cleanup_keeps_a_live_writers_bootstrap_staging[recorded]",
              "test_fix4_REAL_proc_view_of_another_namespace_is_no_proof_of_the_owners_absence[False]",
              "test_fix4_REAL_proc_view_of_another_namespace_is_no_proof_of_the_owners_absence[True]",
          )
          try:
              root = ET.parse(report).getroot()
          except (OSError, ET.ParseError) as exc:
              sys.exit(f"cannot read JUnit report {report}: {exc}")
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          if root.tag not in ("testsuite", "testsuites") or not suites:
              sys.exit(f"cannot read JUnit report {report}: missing testsuite")
          try:
              totals = {
                  key: sum(int(suite.get(key, 0)) for suite in suites)
                  for key in ("tests", "skipped", "errors", "failures")
              }
          except ValueError as exc:
              sys.exit(f"cannot read JUnit report {report}: {exc}")
          for name in required_foreign_ns_cases:
              matches = [
                  case
                  for case in root.iter("testcase")
                  if case.get("name") == name
                  and case.get("file") in (None, bootstrap_file)
                  and (
                      case.get("classname") == bootstrap_class
                      or (case.get("file") == bootstrap_file and not case.get("classname"))
                  )
              ]
              if len(matches) != 1:
                  sys.exit(
                      f"{bootstrap_class}::{name}: expected exactly one testcase in {report}, found {len(matches)}"
                  )
              outcomes = [
                  f"{child.tag}: {child.get('message', '')}"
                  for child in matches[0]
                  if child.tag in ("skipped", "error", "failure")
              ]
              if outcomes:
                  sys.exit(f"{bootstrap_class}::{name}: did not pass: {'; '.join(outcomes)}")
          print(
              f"{bootstrap_file}: {len(required_foreign_ns_cases)} required foreign-namespace cases ran once and passed"
          )
          cases = [
              case
              for case in root.iter("testcase")
              if case.get("file") in (None, s8_file)
              and (
                  case.get("classname") == s8_class
                  or (case.get("file") == s8_file and not case.get("classname"))
              )
          ]
          problems = [
              f"{case.get('name')}: {child.tag}"
              for case in cases
              for child in case
              if child.tag in ("skipped", "error", "failure")
          ]
          print(f"{s8_file}: {len(cases)} cases ran, minimum {minimum}")
          if len(cases) < minimum or problems or totals["errors"] or totals["failures"]:
              sys.exit(
                  f"the Core S8 cancellation selection did not all execute and pass"
                  + (f": {'; '.join(problems)}" if problems else "")
              )

      - name: Test i18n completeness
        run: |
          python tests/i18n/test_languages.py
          if [ $? -ne 0 ]; then
            echo "Language file validation failed"
            exit 1
          fi

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Run Lua workflow contract tests
        run: |
          lua5.4 tests/lua/test_workflow_contracts.lua
          lua5.4 tests/lua/test_runtime_authority.lua

  asset-publication-native:
    name: Asset publication (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Number of tests selected by -m native_publication in the sixteen files
      # below: run pytest --collect-only with that marker and those files. Every
      # matrix entry selects the same set. Raise it when native publication
      # tests are added; the guard fails if fewer ran, so a deselected or removed
      # test cannot pass.
      # The S6 installer tests run here with injected Linux host facts and fake
      # venv, pip and asset steps. Lock, journal, no-replace publication and tree
      # hashing are native on each OS; the S6 route itself is Linux-only so far.
      # The S7 tests use a synthetic vendor archive and the same fakes; the stand-in
      # programs only run on POSIX, so tests that execute them are not marked native.
      # The S8 cancellation matrix uses the same fakes; POSIX-only process-group
      # and signal tests are not marked native.
      MIN_NATIVE_PUBLICATION_TESTS: "458"
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 keeps OpenSSL 3.0.x coverage; ubuntu-26.04 observes a
        # newer OpenSSL alongside it.
        os: [ubuntu-24.04, ubuntu-26.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.11

      - name: Show Python and OpenSSL versions
        # Only the ubuntu-24.04 entry requires OpenSSL 3.0.x; the other
        # entries print their versions without a requirement.
        env:
          REQUIRED_OPENSSL_SERIES: ${{ matrix.os == 'ubuntu-24.04' && '3.0' || '' }}
        shell: python
        run: |
          import os
          import platform
          import ssl
          import sys

          print("Python:", sys.version)
          print("Platform:", platform.platform())
          print("OpenSSL:", ssl.OPENSSL_VERSION)
          required = os.environ.get("REQUIRED_OPENSSL_SERIES", "")
          if required:
              actual = "%d.%d" % ssl.OPENSSL_VERSION_INFO[:2]
              if actual != required:
                  sys.exit(
                      f"expected OpenSSL {required}.x on this runner, found "
                      f"{ssl.OPENSSL_VERSION}. The ubuntu-24.04 jobs keep "
                      "OpenSSL 3.0.x coverage on purpose: socket races in "
                      "asset acquisition surfaced only with it. Keep this "
                      "runner on 3.0.x; observe newer OpenSSL in a separate "
                      "matrix entry."
                  )

      - name: Install test dependency
        # The Core modules under test import only the standard library at
        # module level; pytest is the only third-party requirement.
        run: python -m pip install pytest

      - name: Run native no-replace publication tests
        run: >-
          python -m pytest -q -rs -m native_publication
          --junitxml=native-publication-junit.xml
          tests/test_core_asset_materialization.py
          tests/test_core_asset_preparation.py
          tests/test_core_asset_acquisition.py
          tests/test_core_module_verify.py
          tests/test_core_module_install.py
          tests/test_core_install_events.py
          tests/test_core_cli_encoding.py
          tests/test_core_process_identity.py
          tests/test_core_install_lock.py
          tests/test_core_install_journal.py
          tests/test_core_runtime_manifest.py
          tests/test_core_managed_python.py
          tests/test_core_install_bootstrap.py
          tests/test_core_s6_linux_install.py
          tests/test_core_s7_linux_ffmpeg.py
          tests/test_core_s8_cancel.py

      - name: Require that native publication tests really ran
        # A skip must not look like a pass: fail unless at least the minimum
        # number of tests ran and none were skipped, errored or failed.
        shell: python
        run: |
          import os
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("native-publication-junit.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          totals = {
              key: sum(int(suite.get(key, 0)) for suite in suites)
              for key in ("tests", "skipped", "errors", "failures")
          }
          minimum = max(int(os.environ["MIN_NATIVE_PUBLICATION_TESTS"]), 1)
          print(totals, "minimum", minimum)
          if (
              totals["tests"] < minimum
              or totals["skipped"]
              or totals["errors"]
              or totals["failures"]
          ):
              sys.exit("native publication tests did not all execute and pass")
