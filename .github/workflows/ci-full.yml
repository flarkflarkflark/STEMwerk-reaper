name: CI Fast

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Validate version sync
        run: python tools/version_sync.py --check

      - name: Run release gate
        run: python tools/release_gate.py --check

      - name: Install test dependencies
        run: |
          python -m pip install pytest pyyaml soundfile jsonschema

      - name: Quick script smoke tests
        run: |
          # lightweight invocation that doesn't require heavy ML stacks
          python scripts/reaper/audio_separator_process.py --list-models
          python scripts/reaper/audio_separator_process.py --help

      - name: Run release-relevant pytest suite
        run: |
          python -m pytest -q \
            tests/test_release_gate.py \
            tests/test_b0_model_preflight.py \
            tests/test_b0_small_model_descriptor_2310.py \
            tests/test_2310_run_context_identity.py \
            tests/test_2310_diagnostics_truthfulness.py \
            tests/test_project_context_targeting.py \
            tests/test_dks_extract_import_invariants.py \
            tests/test_windows_payload_contract_2306.py \
            tests/test_linux_package_portability_2306.py \
            tests/test_macos_intel_dks_diagnostics_2306.py \
            tests/test_2306_narrow_hotfix.py \
            tests/test_workflow_contracts.py \
            tests/test_runtime_resolution.py \
            tests/test_normal_stems_authoritative_contract_gate.py \
            tests/test_dks_authoritative_contract_gate.py \
            tests/test_drum_kit_capability_probe.py \
            tests/test_linux_drumsep_rocm_fallback_chain.py \
            tests/i18n/test_languages.py

      - name: Run portable runtime diagnostics harness tests
        # Only the opt-in @pytest.mark.portable subset: fully controlled
        # inputs, no managed-runtime/hardware discovery. The real-* tests
        # require this repo's bootstrapped managed runtime and actual
        # hardware and stay runnable separately, outside portable CI.
        run: >-
          python -m pytest -q -rs -m portable
          tests/test_stemwerk_runtime_diagnostics_harness.py
          tests/test_core_drumsep_runtime.py
          tests/test_core_readiness.py
          tests/test_core_readiness_hardening.py
          tests/test_core_installation_plan.py
          tests/test_core_asset_materialization.py
          tests/test_core_asset_acquisition.py
          tests/test_core_asset_preparation.py
          tests/test_core_catalog_sync.py
          tests/test_dependency_constraints.py::test_audio_separator_process_consumes_shared_managed_ffmpeg_candidates

      - name: Test i18n completeness
        run: |
          python tests/i18n/test_languages.py
          if [ $? -ne 0 ]; then
            echo "Language file validation failed"
            exit 1
          fi

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Run Lua workflow contract tests
        run: |
          lua5.4 tests/lua/test_workflow_contracts.lua
          lua5.4 tests/lua/test_runtime_authority.lua

  asset-publication-native:
    name: Asset publication (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Number of tests selected by -m native_publication in the two files
      # below. Raise it when native publication tests are added; the guard
      # fails if fewer ran, so a deselected or removed test cannot pass.
      MIN_NATIVE_PUBLICATION_TESTS: "18"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install test dependency
        # The Core modules under test import only the standard library at
        # module level; pytest is the only third-party requirement.
        run: python -m pip install pytest

      - name: Run native no-replace publication tests
        run: >-
          python -m pytest -q -rs -m native_publication
          --junitxml=native-publication-junit.xml
          tests/test_core_asset_materialization.py
          tests/test_core_asset_preparation.py

      - name: Require that native publication tests really ran
        # A skip must not look like a pass: fail unless at least the minimum
        # number of tests ran and none were skipped, errored or failed.
        shell: python
        run: |
          import os
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("native-publication-junit.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          totals = {
              key: sum(int(suite.get(key, 0)) for suite in suites)
              for key in ("tests", "skipped", "errors", "failures")
          }
          minimum = max(int(os.environ["MIN_NATIVE_PUBLICATION_TESTS"]), 1)
          print(totals, "minimum", minimum)
          if (
              totals["tests"] < minimum
              or totals["skipped"]
              or totals["errors"]
              or totals["failures"]
          ):
              sys.exit("native publication tests did not all execute and pass")
