name: macOS Apple Silicon setup guardrails

on:
  push:
    branches:
      - mac-mps-fix-suffixed-files
  workflow_dispatch:

jobs:
  macos-setup-guardrails:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show runner diagnostics
        run: |
          echo "runner.os=${RUNNER_OS}"
          echo "runner.arch=${RUNNER_ARCH}"
          uname -a
          uname -m
          sysctl -n hw.optional.arm64 || true
          sw_vers
          python3 --version
          python3 - <<'PY'
          import platform
          import struct
          import sys
          import sysconfig
          print(f"python_executable={sys.executable}")
          print(f"python_version={platform.python_version()}")
          print(f"platform_system={platform.system()}")
          print(f"platform_platform={platform.platform()}")
          print(f"platform_machine={platform.machine()}")
          print(f"sysconfig_platform={sysconfig.get_platform()}")
          print(f"pointer_bits={struct.calcsize('P') * 8}")
          PY

      - name: Run focused guardrail tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pytest tests/test_dependency_constraints.py -v --tb=short -s

      - name: Verify Rosetta guardrail strings exist
        run: |
          grep -q 'sysctl -n hw.optional.arm64' scripts/reaper/STEMwerk_Bootstrap_macOS.sh
          grep -q 'rosetta_python_on_apple_silicon' scripts/reaper/STEMwerk_Bootstrap_macOS.sh
          grep -q 'MAC_HOST_ARCH' scripts/reaper/STEMwerk_Bootstrap_macOS.sh
          grep -q 'PYTHON_SYSCONFIG_PLATFORM' scripts/reaper/STEMwerk_Bootstrap_macOS.sh
          grep -q 'rosetta_python_on_apple_silicon' scripts/reaper/_internal/STEMwerk_Setup_Internal.lua
          grep -q 'hw.optional.arm64' scripts/reaper/STEMwerk_Save_Support_Bundle.lua
          grep -q 'python_sysconfig_platform' scripts/reaper/STEMwerk_Save_Support_Bundle.lua

      - name: Upload macOS setup guardrail artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-setup-guardrails
          path: |
            scripts/reaper/STEMwerk_Bootstrap_macOS.sh
            scripts/reaper/_internal/STEMwerk_Setup_Internal.lua
            scripts/reaper/STEMwerk_Save_Support_Bundle.lua
            tests/test_dependency_constraints.py
