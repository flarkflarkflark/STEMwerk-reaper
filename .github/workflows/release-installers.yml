name: Build installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to (e.g. v2.1.0). Leave empty when running from a tag push."
        required: false
        default: ""
      upload_release_assets:
        description: "Upload built installers to the GitHub release. Ignored on tag pushes."
        required: false
        default: "true"
      windows_bundled_asset:
        description: "Also build a bundled Windows installer with Python + FFmpeg included."
        required: false
        default: "false"
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-installers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STEMWERK_VERSION_FILE: VERSION

jobs:
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release_tag: ${{ steps.v.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version sync
        run: python3 tools/version_sync.py --check

      - id: v
        name: Validate tag matches VERSION
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < "${STEMWERK_VERSION_FILE}")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Determine release tag:
          # - Tag push: use the pushed tag
          # - workflow_dispatch: use the provided input
          RELEASE_TAG="${{ github.event.inputs.tag }}"
          if [[ -z "$RELEASE_TAG" && "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          fi

          # Nice UX: when manually running workflow_dispatch, default to v<VERSION>
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG="v$VERSION"
          fi

          # Accept '2.1.1' and normalize to 'v2.1.1'
          if [[ "$RELEASE_TAG" != v* ]]; then
            RELEASE_TAG="v$RELEASE_TAG"
          fi

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          TAG_VER="${RELEASE_TAG#v}"
          if [[ "$TAG_VER" != "$VERSION" ]]; then
            echo "ERROR: release tag $RELEASE_TAG does not match VERSION=$VERSION"
            exit 1
          fi

  windows-exe:
    needs: validate-version
    runs-on: windows-latest
    env:
      STEMWERK_VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress -y
          choco install imagemagick --no-progress -y

      - name: Generate installer assets from SVG
        shell: powershell
        run: |
          $assets = "installer\\assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null

          $svg = Join-Path $assets "stemwerk.svg"
          if (Test-Path $svg) {
            $png = Join-Path $assets "stemwerk.png"
            & magick -background none -density 220 $svg -resize 512x512 $png

            $ico = Join-Path $assets "stemwerk.ico"
            & magick $png -define icon:auto-resize=256,128,64,48,32,16 $ico

            $wiz = Join-Path $assets "stemwerk-wizard.bmp"
            & magick $png -resize 140x140 -background white -gravity center -extent 164x314 $wiz

            $wizSmall = Join-Path $assets "stemwerk-wizard-small.bmp"
            & magick $png -resize 48x48 -background white -gravity center -extent 55x58 $wizSmall
          }

      - name: Build .exe (Inno Setup)
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "installer\windows\STEMwerk.iss"

      - name: Fetch bundled runtime assets (Windows)
        if: ${{ github.event_name == 'push' || github.event.inputs.windows_bundled_asset == 'true' }}
        shell: powershell
        run: |
          $pyDir = "installer\windows\payload\python"
          $ffmpegDir = "installer\windows\payload\ffmpeg"
          New-Item -ItemType Directory -Force -Path $pyDir | Out-Null
          New-Item -ItemType Directory -Force -Path $ffmpegDir | Out-Null

          $pyOut = Join-Path $pyDir "python-3.11.8-amd64.exe"
          $ffOut = Join-Path $ffmpegDir "ffmpeg-release-essentials.zip"

          Invoke-WebRequest "https://www.python.org/ftp/python/3.11.8/python-3.11.8-amd64.exe" -OutFile $pyOut
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $ffOut

      - name: Build bundled .exe (Inno Setup)
        if: ${{ github.event_name == 'push' || github.event.inputs.windows_bundled_asset == 'true' }}
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          $env:STEMWERK_BUNDLE_RUNTIME = "1"
          $env:STEMWERK_OUTPUT_SUFFIX = "-bundled"
          & $iscc "installer\windows\STEMwerk.iss"

      - name: Build offline patch .exe (Inno Setup)
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "installer\windows\STEMwerk_Offline_Patch.iss"

      - name: Upload build artifacts (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: installer/windows/dist/*.exe
          if-no-files-found: error

      - name: Upload release asset (Windows .exe)
        if: ${{ github.event_name == 'push' || github.event.inputs.upload_release_assets == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-version.outputs.release_tag }}
          # Windows update patch is retired for the 2.3.0.0 refresh because 2.3 requires
          # full runtime migration (main venv + DrumSep venv + model assets + ready_to_go.env).
          # Publish only the supported full Windows installer assets.
          files: |
            installer/windows/dist/STEMwerk-Setup-*.exe

  macos-pkg:
    needs: validate-version
    runs-on: macos-latest
    env:
      STEMWERK_VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Build .pkg
        shell: bash
        run: |
          bash installer/macos/build_pkg.sh

      - name: Upload build artifacts (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: installers-macos
          path: installer/macos/dist/*.pkg
          if-no-files-found: error

      - name: Upload release asset (macOS .pkg)
        if: ${{ github.event_name == 'push' || github.event.inputs.upload_release_assets == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-version.outputs.release_tag }}
          files: installer/macos/dist/*.pkg

  linux-packages:
    needs: validate-version
    runs-on: ubuntu-latest
    env:
      STEMWERK_VERSION: ${{ needs.validate-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rsync dpkg-dev rpm curl

      - name: Build .deb
        shell: bash
        run: |
          bash installer/linux/build_deb.sh

      - name: Build .rpm
        shell: bash
        run: |
          bash installer/linux/build_rpm.sh

      - name: Build AppImage
        shell: bash
        run: |
          bash installer/linux/build_appimage.sh

      - name: Build Arch package
        shell: bash
        run: |
          bash installer/linux/build_archpkg.sh

      - name: Upload build artifacts (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: installers-linux
          path: |
            installer/linux/dist/*.deb
            installer/linux/dist/*.rpm
            installer/linux/dist/*.AppImage
            installer/linux/dist/*.pkg.tar.zst
          if-no-files-found: error

      - name: Upload release assets (Linux)
        if: ${{ github.event_name == 'push' || github.event.inputs.upload_release_assets == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-version.outputs.release_tag }}
          files: |
            installer/linux/dist/*.deb
            installer/linux/dist/*.rpm
            installer/linux/dist/*.AppImage
            installer/linux/dist/*.pkg.tar.zst
