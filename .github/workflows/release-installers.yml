name: Build installers

# Two distinct, non-overlapping modes, selected by upload_release_assets:
#
# BUILD mode (upload_release_assets=false, the default): builds an
# unpublished RC from an exact, explicitly pinned commit. The release tag
# does not need to exist yet -- tagging happens only after the RC artifacts
# are validated, outside this workflow.
#
# PUBLICATION mode (upload_release_assets=true): never builds. It republishes
# the exact artifact bytes from a prior successful BUILD run (build_run_id),
# after proving the release tag exists and resolves to the same source_commit
# that run was built from, and that source_commit matches VERSION/tag. This
# is what makes publication byte-identical to what was actually validated,
# rather than a fresh (and not guaranteed byte-reproducible) rebuild.
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: "Full 40-hex commit SHA to build (BUILD mode), or to verify the release tag against (PUBLICATION mode). Never a branch/tag name."
        required: true
      tag:
        description: "Release tag (e.g. v2.3.1.2). Must match VERSION; for publication it must already exist and resolve to source_commit."
        required: false
        default: ""
      upload_release_assets:
        description: "Publish the already-built installers from build_run_id to the GitHub release. Never rebuilds. Defaults to off."
        required: false
        default: "false"
      build_run_id:
        description: "Run ID of the prior successful BUILD-mode run (same source_commit) whose artifacts to publish. Required when upload_release_assets is true."
        required: false
        default: ""
      windows_bundled_asset:
        description: "Also build a bundled Windows installer with Python + FFmpeg included."
        required: false
        default: "false"
permissions:
  contents: write
  actions: read

concurrency:
  group: release-installers-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STEMWERK_VERSION_FILE: VERSION

jobs:
  resolve-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.m.outputs.mode }}
      version: ${{ steps.m.outputs.version }}
      release_tag: ${{ steps.m.outputs.release_tag }}
      source_commit: ${{ steps.m.outputs.source_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.source_commit }}
          fetch-depth: 0
          fetch-tags: true

      - name: Require a clean checkout
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "ERROR: checkout is not clean."
            git status --porcelain
            exit 1
          fi

      - name: Validate version sync
        run: python3 tools/version_sync.py --check

      - name: Verify ReaPack payload sources are immutable
        run: python3 tools/release_gate.py --check

      - id: m
        name: Resolve BUILD vs PUBLICATION mode and validate the exact source commit
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_COMMIT="${{ github.event.inputs.source_commit }}"
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: source_commit must be a full 40-hex commit SHA, not a branch or tag name."
            echo "Got: $SOURCE_COMMIT"
            exit 1
          fi
          SOURCE_COMMIT="$(tr '[:upper:]' '[:lower:]' <<< "$SOURCE_COMMIT")"

          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [[ "$ACTUAL_SHA" != "$SOURCE_COMMIT" ]]; then
            echo "ERROR: checked-out commit $ACTUAL_SHA does not match requested source_commit $SOURCE_COMMIT."
            exit 1
          fi
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"

          VERSION="$(tr -d '\r\n' < "${STEMWERK_VERSION_FILE}")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          RELEASE_TAG="${{ github.event.inputs.tag }}"
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG="v$VERSION"
          fi
          if [[ "$RELEASE_TAG" != v* ]]; then
            RELEASE_TAG="v$RELEASE_TAG"
          fi
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          TAG_VER="${RELEASE_TAG#v}"
          if [[ "$TAG_VER" != "$VERSION" ]]; then
            echo "ERROR: release tag $RELEASE_TAG does not match VERSION=$VERSION"
            exit 1
          fi

          if [[ "${{ github.event.inputs.upload_release_assets }}" == "true" ]]; then
            echo "mode=publish" >> "$GITHUB_OUTPUT"
          else
            echo "mode=build" >> "$GITHUB_OUTPUT"
          fi

      # --- PUBLICATION-only gates. BUILD mode never requires the tag to exist. ---

      - name: "Publication gate: release tag must exist and resolve to source_commit"
        if: ${{ github.event.inputs.upload_release_assets == 'true' }}
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.m.outputs.release_tag }}
          SOURCE_COMMIT: ${{ steps.m.outputs.source_commit }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null 2>&1; then
            echo "ERROR: release tag ${RELEASE_TAG} does not exist."
            echo "Publication requires an existing tag created after the RC build was validated;"
            echo "it must never run against an unpinned/ambiguous or not-yet-tagged commit."
            exit 1
          fi

          TAG_SHA="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$TAG_SHA" != "$SOURCE_COMMIT" ]]; then
            echo "ERROR: release tag ${RELEASE_TAG} resolves to $TAG_SHA, not the requested source_commit $SOURCE_COMMIT."
            echo "Publication must never publish artifacts for a different revision than the tag points at."
            exit 1
          fi

          echo "Verified: tag ${RELEASE_TAG} resolves to source_commit ${SOURCE_COMMIT}, and HEAD matches both."

      - name: "Publication gate: require the prior validated build run"
        if: ${{ github.event.inputs.upload_release_assets == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ github.event.inputs.build_run_id }}" ]]; then
            echo "ERROR: upload_release_assets=true requires build_run_id: the run ID of the prior"
            echo "successful BUILD-mode run for this exact source_commit. Publication republishes that"
            echo "run's already-validated artifact bytes -- it never rebuilds."
            exit 1
          fi

  windows-exe:
    needs: resolve-mode
    if: ${{ needs.resolve-mode.outputs.mode == 'build' }}
    runs-on: windows-latest
    env:
      STEMWERK_VERSION: ${{ needs.resolve-mode.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve-mode.outputs.source_commit }}

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress -y
          choco install imagemagick --no-progress -y

      - name: Generate installer assets from SVG
        shell: powershell
        run: |
          $assets = "installer\\assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null

          $svg = Join-Path $assets "stemwerk.svg"
          if (Test-Path $svg) {
            $png = Join-Path $assets "stemwerk.png"
            & magick -background none -density 220 $svg -resize 512x512 $png

            $ico = Join-Path $assets "stemwerk.ico"
            & magick $png -define icon:auto-resize=256,128,64,48,32,16 $ico

            $wiz = Join-Path $assets "stemwerk-wizard.bmp"
            & magick $png -resize 140x140 -background white -gravity center -extent 164x314 $wiz

            $wizSmall = Join-Path $assets "stemwerk-wizard-small.bmp"
            & magick $png -resize 48x48 -background white -gravity center -extent 55x58 $wizSmall
          }

      - name: Build .exe (Inno Setup)
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "installer\windows\STEMwerk.iss"

      - name: Fetch bundled runtime assets (Windows)
        if: ${{ github.event_name == 'push' || github.event.inputs.windows_bundled_asset == 'true' }}
        shell: powershell
        run: |
          $env:STEMWERK_SKIP_WHEELHOUSE = "1"
          & ".\installer\windows\fetch_runtime_assets.ps1"

      - name: Build bundled .exe (Inno Setup)
        if: ${{ github.event_name == 'push' || github.event.inputs.windows_bundled_asset == 'true' }}
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          $env:STEMWERK_BUNDLE_RUNTIME = "1"
          $env:STEMWERK_OUTPUT_SUFFIX = "-bundled"
          & $iscc "installer\windows\STEMwerk.iss"

      # Windows update patch remains retired for 2.3.0.4 because 2.3 requires
      # full runtime migration (main venv + DrumSep venv + model assets + ready_to_go.env).
      # Publish only the supported full Windows installer assets.
      - name: Upload build artifacts (Windows)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-windows
          path: |
            installer/windows/dist/STEMwerk-Setup-*.exe
          if-no-files-found: error

  macos-pkg:
    needs: resolve-mode
    if: ${{ needs.resolve-mode.outputs.mode == 'build' }}
    # Pin the Apple Silicon runner OS. Exact Xcode/SDK/clang versions are recorded
    # in SOURCE_PROVENANCE.json instead of claiming byte-identical reproducibility.
    runs-on: macos-14
    env:
      STEMWERK_VERSION: ${{ needs.resolve-mode.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve-mode.outputs.source_commit }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          architecture: arm64

      - name: Verify pinned Apple Silicon release host
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -s)" == "Darwin" ]]
          [[ "$(uname -m)" == "arm64" ]]
          sw_vers
          xcodebuild -version
          clang --version
          xcrun --sdk macosx --show-sdk-version

      - name: Prepare pinned managed Python payload
        shell: bash
        run: |
          set -euo pipefail
          filename="$(python tools/macos_managed_python.py --print-artifact-field managed_python_artifact_filename)"
          url="$(python tools/macos_managed_python.py --print-artifact-field managed_python_artifact_url)"
          expected="$(python tools/macos_managed_python.py --print-artifact-field managed_python_artifact_sha256)"
          archive="$RUNNER_TEMP/$filename"
          curl --fail --location --show-error "$url" --output "$archive"
          actual="$(shasum -a 256 "$archive" | awk '{print $1}')"
          [[ "$actual" == "$expected" ]]
          printf '%s\n' "$archive" > "$RUNNER_TEMP/stemwerk-managed-python-artifact-path"

      - name: Build official portable FFmpeg and bundled runtime payload
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_macos_apple_silicon_payload.py \
            --version "$STEMWERK_VERSION" \
            --output scripts/reaper/_bundled/macos/apple-silicon \
            --managed-python-artifact "$(cat "$RUNNER_TEMP/stemwerk-managed-python-artifact-path")" \
            --source-artifact-dir installer/macos/dist/source \
            --release-mode

      - name: Build and audit standard and bundled packages
        shell: bash
        run: |
          set -euo pipefail
          bash installer/macos/build_pkg.sh
          bash installer/macos/build_pkg.sh --variant bundled-apple-silicon
          test -f "installer/macos/dist/STEMwerk-$STEMWERK_VERSION.pkg"
          test -f "installer/macos/dist/STEMwerk-$STEMWERK_VERSION-bundled-apple-silicon.pkg"
          test -f installer/macos/build/online/final-package-audit.json
          test -f installer/macos/build/bundled-apple-silicon/final-package-audit.json

      - name: Write macOS release checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd installer/macos/dist
            shasum -a 256 \
              "STEMwerk-$STEMWERK_VERSION.pkg" \
              "STEMwerk-$STEMWERK_VERSION-bundled-apple-silicon.pkg" \
              source/ffmpeg-8.0.3.tar.xz \
              source/ffmpeg-8.0.3.tar.xz.sha256 \
              > "SHA256SUMS-$STEMWERK_VERSION-macos.txt"
          )

      - name: Upload build artifacts (macOS)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-macos
          path: |
            installer/macos/dist/*.pkg
            installer/macos/dist/*.txt
            installer/macos/dist/source/*
            installer/macos/build/*/final-package-audit.json
          if-no-files-found: error

  linux-packages:
    needs: resolve-mode
    if: ${{ needs.resolve-mode.outputs.mode == 'build' }}
    runs-on: ubuntu-latest
    env:
      STEMWERK_VERSION: ${{ needs.resolve-mode.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve-mode.outputs.source_commit }}

      - name: Install build deps
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rsync curl

      # .deb/.rpm/Arch packaging is build-tooling only (installer/linux/build_deb.sh,
      # build_rpm.sh, build_archpkg.sh); it is not part of the published 2.3.1.2
      # artifact matrix, so this workflow builds only the AppImage.
      - name: Build AppImage
        shell: bash
        run: |
          bash installer/linux/build_appimage.sh

      - name: Upload build artifacts (Linux)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-linux
          path: |
            installer/linux/dist/*.AppImage
          if-no-files-found: error

  checksums:
    needs: [resolve-mode, windows-exe, macos-pkg, linux-packages]
    if: ${{ needs.resolve-mode.outputs.mode == 'build' }}
    runs-on: ubuntu-latest
    env:
      STEMWERK_VERSION: ${{ needs.resolve-mode.outputs.version }}
    steps:
      - name: Download built installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          pattern: installers-*
          merge-multiple: true

      # If signing/notarization is ever applied to these artifacts, that must
      # happen (externally) before this step runs, so the manifest below
      # checksums the exact bytes that get published -- never a pre-signing
      # intermediate.
      - name: Generate combined checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          FILES=(
            "STEMwerk-Setup-$STEMWERK_VERSION.exe"
            "STEMwerk-Setup-$STEMWERK_VERSION-bundled.exe"
            "STEMwerk-$STEMWERK_VERSION.pkg"
            "STEMwerk-$STEMWERK_VERSION-bundled-apple-silicon.pkg"
            "STEMwerk-$STEMWERK_VERSION-x86_64.AppImage"
          )
          for f in "${FILES[@]}"; do
            test -f "$f" || { echo "ERROR: expected release artifact missing: $f"; exit 1; }
          done
          sha256sum "${FILES[@]}" > "SHA256SUMS-$STEMWERK_VERSION.txt"
          cat "SHA256SUMS-$STEMWERK_VERSION.txt"

      - name: Upload checksum manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-checksums
          path: artifacts/SHA256SUMS-*.txt
          if-no-files-found: error

  publish:
    needs: resolve-mode
    if: ${{ needs.resolve-mode.outputs.mode == 'publish' }}
    runs-on: ubuntu-latest
    steps:
      # Never rebuilds: downloads the exact artifact bytes uploaded by the
      # prior BUILD-mode run identified by build_run_id (already proven, by
      # the resolve-mode gates above, to be the run for this same
      # source_commit/tag). If that run's artifacts are gone (expired,
      # deleted), this step fails closed instead of silently falling back to
      # a fresh build.
      - name: Download validated build artifacts and checksum manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.inputs.build_run_id }}
          path: artifacts
          pattern: installers-*
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.resolve-mode.outputs.release_tag }}
          files: |
            artifacts/STEMwerk-Setup-*.exe
            artifacts/*.pkg
            artifacts/*.AppImage
            artifacts/SHA256SUMS-*.txt
