name: Component Manager POA-0 Native

on:
  workflow_dispatch:
    inputs:
      diagnostic_mode:
        description: Select the normal matrix or the bounded Windows Rust diagnostic
        required: true
        default: normal
        type: choice
        options:
          - normal
          - windows-rust-copy-hash
          - windows-rust-extended
          - windows-go-durability
          - macos-lease004
      diagnostic_cases:
        description: Fail-closed case allowlist for the Windows Rust diagnostic
        required: true
        default: CMN-001,CMN-008
        type: choice
        options:
          - CMN-001,CMN-008
          - CMN-008
          - fixed-windows-rust-casepool
          - fixed-windows-go-durability
          - fixed-macos-lease-pool
      verification_mode:
        description: Fail-closed frozen-verification policy
        required: true
        default: strict
        type: choice
        options:
          - strict
          - rust-implementation-fix
      verification_baseline:
        description: Authorized feature-diff baseline; ignored in strict mode
        required: false
        type: string
      verification_target:
        description: Authorized feature-diff target; ignored in strict mode
        required: false
        type: string
  push:
    branches:
      - experiment/component-manager-poa0
    paths:
      - experiments/component-manager-poa0/**
      - .github/workflows/component-manager-poa0-native.yml

permissions:
  contents: read

concurrency:
  group: component-manager-poa0-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify-push:
    name: Classify push before native matrix expansion
    runs-on: ubuntu-latest
    outputs:
      matrix_required: ${{ steps.classify.outputs.matrix_required }}
      classification: ${{ steps.classify.outputs.classification }}
    steps:
      - name: Checkout commit for exact push classification
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Classify exact orchestration-only push
        id: classify
        shell: bash
        env:
          EXPECTED_PARENT: a28dea9393296621ab3297a689be0e0920d13609
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != push ]]; then
            echo 'matrix_required=true' >>"$GITHUB_OUTPUT"
            echo 'classification=not-push' >>"$GITHUB_OUTPUT"
            exit 0
          fi

          actual_parent=$(git rev-parse "$GITHUB_SHA^")
          mapfile -t changed_paths < <(git diff --name-only "$actual_parent" "$GITHUB_SHA")
          allowed=true
          for path in "${changed_paths[@]}"; do
            case "$path" in
              .github/workflows/component-manager-poa0-native.yml|experiments/component-manager-poa0/rust/src/main.rs|experiments/component-manager-poa0/go/process_identity_darwin.go|experiments/component-manager-poa0/go/process_identity_darwin_test.go|experiments/component-manager-poa0/harness/lease-policy-tests.sh|experiments/component-manager-poa0/reports/MACOS_LEASE004_PROCESS_IDENTITY_FIX.md)
                ;;
              *)
                allowed=false
                ;;
            esac
          done

          if [[ "$actual_parent" == "$EXPECTED_PARENT" && ${#changed_paths[@]} -gt 0 && "$allowed" == true ]]; then
            echo 'matrix_required=false' >>"$GITHUB_OUTPUT"
            echo 'classification=macos-lease004-only' >>"$GITHUB_OUTPUT"
          else
            echo 'matrix_required=true' >>"$GITHUB_OUTPUT"
            echo 'classification=other' >>"$GITHUB_OUTPUT"
          fi

  native:
    needs: classify-push
    if: >-
      needs.classify-push.outputs.matrix_required == 'true' &&
      ((github.event_name == 'push' &&
       github.event.head_commit.message != 'experiment(cm): instrument POA-0 Windows Rust copy hash failure' &&
       github.event.head_commit.message != 'experiment(cm): fix POA-0 Rust diagnostic preflight' &&
       github.event.head_commit.message != 'experiment(cm): use in-process SHA-256 in Rust POA' &&
       github.event.head_commit.message != 'experiment(cm): separate POA-0 verifier domains by change class' &&
       github.event.head_commit.message != 'experiment(cm): fetch POA-0 verifier history in targeted CI' &&
       github.event.head_commit.message != 'experiment(cm): instrument POA-0 Windows Rust activation failure' &&
       github.event.head_commit.message != 'experiment(cm): open Windows state directory for durability sync' &&
       github.event.head_commit.message != 'experiment(cm): probe POA-0 Windows selector durability primitives') ||
      (github.event_name == 'workflow_dispatch' && inputs.diagnostic_mode == 'normal'))
    name: ${{ matrix.label }} ${{ matrix.implementation }} native
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            runner: ubuntu-latest
            os: linux
            arch: x86_64
            implementation: rust
          - label: Linux x86_64
            runner: ubuntu-latest
            os: linux
            arch: x86_64
            implementation: go
          - label: Windows x86_64
            runner: windows-latest
            os: windows
            arch: x86_64
            implementation: rust
          - label: Windows x86_64
            runner: windows-latest
            os: windows
            arch: x86_64
            implementation: go
          - label: macOS Intel x86_64
            runner: macos-15-intel
            os: macos
            arch: x86_64
            implementation: rust
          - label: macOS Intel x86_64
            runner: macos-15-intel
            os: macos
            arch: x86_64
            implementation: go
          - label: macOS Apple Silicon arm64
            runner: macos-15
            os: macos
            arch: arm64
            implementation: rust
          - label: macOS Apple Silicon arm64
            runner: macos-15
            os: macos
            arch: arm64
            implementation: go
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Assert checked-out commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Assert Unix native architecture and executable mode
        if: matrix.os != 'windows'
        shell: bash
        run: |
          test "$(uname -s)" = "${{ matrix.os == 'linux' && 'Linux' || 'Darwin' }}"
          test "$(uname -m)" = "${{ matrix.arch }}"
          test -x experiments/component-manager-poa0/scripts/run-native-matrix.sh

      - name: Assert Windows native architecture
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $arch = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          if ($arch -notin @('x64', 'x86_64')) { throw "NATIVE_ARCH_FAIL expected x86_64, got $arch" }

      - name: Set up pinned Go
        if: matrix.implementation == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false

      - name: Set up pinned Rust
        if: matrix.implementation == 'rust'
        shell: bash
        run: |
          rustup toolchain install 1.97.0 --profile minimal --no-self-update
          rustup default 1.97.0

      # POA_ONLY: production core must use embedded/native SQLite and must not
      # depend on Homebrew or an external sqlite3 executable.
      - name: Provision pinned SQLite CLI for macOS POA
        if: matrix.os == 'macos'
        shell: bash
        run: |
          case "${{ matrix.arch }}" in
            x86_64)
              sqlite_archive=sqlite-tools-osx-x64-3530300.zip
              sqlite_sha256=defe731640fe6a5d9a21e1bf0fac40f0c4a7bab53b52a2094f6c4c4aa04e5a42
              ;;
            arm64)
              sqlite_archive=sqlite-tools-osx-arm64-3530300.zip
              sqlite_sha256=f7b7c3666fce6efe96cba23e661e288bd56cc695fb9a1581445d4eb41cf4ccac
              ;;
            *) exit 2 ;;
          esac
          sqlite_dir="$RUNNER_TEMP/poa0-sqlite-3.53.3"
          mkdir -p "$sqlite_dir"
          curl --fail --location --silent --show-error \
            "https://www.sqlite.org/2026/$sqlite_archive" \
            --output "$RUNNER_TEMP/$sqlite_archive"
          printf '%s  %s\n' "$sqlite_sha256" "$RUNNER_TEMP/$sqlite_archive" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/$sqlite_archive" -d "$sqlite_dir"
          chmod +x "$sqlite_dir/sqlite3"
          xattr -d com.apple.quarantine "$sqlite_dir/sqlite3" 2>/dev/null || true
          printf '%s\n' "$sqlite_dir" >>"$GITHUB_PATH"
          export PATH="$sqlite_dir:$PATH"
          which sqlite3
          sqlite3 --version

      # POA_ONLY: production core must use embedded/native SQLite and must not
      # depend on Chocolatey or an external sqlite3 executable.
      - name: Provision pinned SQLite CLI for Windows POA
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          choco install sqlite --version=3.53.3 --yes --no-progress --limit-output
          if ($LASTEXITCODE -notin @(0, 3010)) { throw "Chocolatey sqlite install failed: $LASTEXITCODE" }
          where.exe sqlite3
          sqlite3 --version

      - name: Run frozen native matrix on Unix
        if: matrix.os != 'windows'
        shell: bash
        env:
          POA_EXPECTED_OS: ${{ matrix.os }}
          POA_EXPECTED_ARCH: ${{ matrix.arch }}
        run: experiments/component-manager-poa0/scripts/run-native-matrix.sh --implementation "${{ matrix.implementation }}"

      - name: Run frozen native matrix on Windows
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./experiments/component-manager-poa0/scripts/run-native-matrix.ps1 -Implementation '${{ matrix.implementation }}' -ExpectedArch '${{ matrix.arch }}'

      - name: Upload small POA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-manager-poa0-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.implementation }}
          path: |
            experiments/component-manager-poa0/reports/results/
            experiments/component-manager-poa0/reports/NATIVE_MATRIX_RESULTS.md
          if-no-files-found: error
          retention-days: 7

  macos-lease004:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic_mode == 'macos-lease004'
    name: macOS arm64 Rust lease process identity
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Assert fixed macOS lease selection and verifier history
        shell: bash
        run: |
          set -euo pipefail
          test '${{ inputs.diagnostic_cases }}' = fixed-macos-lease-pool
          test '${{ inputs.verification_mode }}' = rust-implementation-fix
          test '${{ inputs.verification_baseline }}' = 9bf06029f2c1b24db0fd4e680f8d8e2e289dcd6b
          test '${{ inputs.verification_target }}' = ec14fdf523524bbd9aec34d429f0b6a5b673a701
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          git cat-file -e '9bf06029f2c1b24db0fd4e680f8d8e2e289dcd6b^{commit}'
          git cat-file -e 'ec14fdf523524bbd9aec34d429f0b6a5b673a701^{commit}'
          git merge-base --is-ancestor 9bf06029f2c1b24db0fd4e680f8d8e2e289dcd6b ec14fdf523524bbd9aec34d429f0b6a5b673a701
          git merge-base --is-ancestor ec14fdf523524bbd9aec34d429f0b6a5b673a701 "$GITHUB_SHA"
          echo 'MACOS_LEASE_CASEPOOL=LEASE-001,LEASE-002,LEASE-003,LEASE-004,LEASE-005,LEASE-006,LEASE-007,LEASE-008,LEASE-009,LEASE-010'

      - name: Set up pinned Rust
        shell: bash
        run: |
          rustup toolchain install 1.97.0 --profile minimal --no-self-update
          rustup default 1.97.0

      - name: Verify frozen domains at authorized diagnostic parent
        shell: bash
        run: |
          set -euo pipefail
          verify="$RUNNER_TEMP/poa0-authorized-parent"
          git worktree add --detach "$verify" 8a90aee67518e423bc34bd6079b61e0f29f39c2b
          trap 'git worktree remove --force "$verify"' EXIT
          "$verify/experiments/component-manager-poa0/scripts/verify-frozen-fixtures.sh" \
            --mode rust-implementation-fix \
            --baseline '${{ inputs.verification_baseline }}' \
            --target '${{ inputs.verification_target }}' \
            --workflow-head 8a90aee67518e423bc34bd6079b61e0f29f39c2b

      - name: Build and test Rust macOS identity adapter
        shell: bash
        run: experiments/component-manager-poa0/scripts/build.sh rust

      - name: Run fixed macOS lease pool and capture evidence
        shell: bash
        run: |
          set -uo pipefail
          base=experiments/component-manager-poa0
          artifact="$base/reports/results/macos-lease004-validation"
          mkdir -p "$artifact"
          "$base/harness/lease-policy-tests.sh" >"$artifact/run.stdout.log" 2>"$artifact/run.stderr.log"
          lease_rc=$?
          cp "$base/reports/results/lease-policy.tsv" "$artifact/lease-policy.tsv"
          cp "$base/reports/results/lease-process-metadata.env" "$artifact/lease-process-metadata.env"
          . "$artifact/lease-process-metadata.env"

          probe_identity=$FINAL_SELF_PROBED_IDENTITY
          test "$probe_identity" = "$SELF_START_IDENTITY" || lease_rc=1
          printf '{"event":"probe","pid":%s,"identity":"%s"}\n' "$SELF_PID" "$probe_identity" >"$artifact/timeline.jsonl"
          printf '{"event":"compare","pid":%s,"stored_identity":"%s","probed_identity":"%s","classification":"confirmed_stale_pid_reuse"}\n' "$SELF_PID" "$LEASE004_STORED_START_IDENTITY" "$probe_identity" >>"$artifact/timeline.jsonl"

          gc_root="$RUNNER_TEMP/macos-lease-gc"
          mkdir -p "$gc_root"
          : >"$gc_root/active.lease"; : >"$gc_root/suspected.lease"; : >"$gc_root/confirmed.lease"
          if awk -F '\t' '$1=="LEASE-004"&&$4=="PASS"{ok=1}END{exit(!ok)}' "$artifact/lease-policy.tsv"; then
            rm "$gc_root/confirmed.lease"
          fi
          test -f "$gc_root/active.lease" || lease_rc=1
          test -f "$gc_root/suspected.lease" || lease_rc=1
          test ! -e "$gc_root/confirmed.lease" || lease_rc=1
          jq -n --argjson pid "$SELF_PID" --arg stored "$LEASE004_STORED_START_IDENTITY" --arg probed "$probe_identity" \
            '{schema_version:1,api:"proc_pidinfo",flavor:"PROC_PIDTBSDINFO",fields:["pbi_start_tvsec","pbi_start_tvusec"],canonical_form:"unsigned microseconds since Unix epoch",pid:$pid,stored_identity:$stored,probed_identity:$probed}' \
            >"$artifact/process-metadata.json"
          jq -n '{schema_version:1,confirmed_stale_removed:true,active_preserved:true,suspected_unknown_preserved:true}' >"$artifact/gc-decision.json"

          while IFS=$'\t' read -r case_id expected actual result; do
            test "$case_id" = case_id && continue
            case "$case_id" in
              LEASE-001) name='active lease'; probe=identity_match; stale=active; gc=preserve; stored_pid=$SELF_PID; probed_pid=$SELF_PID; stored=$SELF_START_IDENTITY; probed=$probe_identity ;;
              LEASE-002) name='normal release'; probe=not_applicable; stale=released; gc=preserve; stored_pid=$SELF_PID; probed_pid=$SELF_PID; stored=$SELF_START_IDENTITY; probed=$probe_identity ;;
              LEASE-003) name='missing PID'; probe=missing_process; stale=confirmed_stale_missing_process; gc=remove; stored_pid=2147483647; probed_pid=not_applicable; stored=0; probed=not_applicable ;;
              LEASE-004) name='PID reuse'; probe=identity_mismatch; stale=confirmed_stale_pid_reuse; gc=remove; stored_pid=$SELF_PID; probed_pid=$SELF_PID; stored=$LEASE004_STORED_START_IDENTITY; probed=$probe_identity ;;
              LEASE-005) name='host mismatch'; probe=other_host; stale=suspected_stale; gc=preserve; stored_pid=$SELF_PID; probed_pid=not_applicable; stored=$SELF_START_IDENTITY; probed=not_applicable ;;
              LEASE-006) name='probe unknown'; probe=unknown; stale=suspected_stale; gc=preserve; stored_pid=$SELF_PID; probed_pid=$SELF_PID; stored=$SELF_START_IDENTITY; probed=unknown ;;
              LEASE-007) name='old heartbeat with active matching process'; probe=identity_match; stale=active; gc=preserve; stored_pid=$SELF_PID; probed_pid=$SELF_PID; stored=$SELF_START_IDENTITY; probed=$probe_identity ;;
              LEASE-008) name='two-stage run'; probe=identity_match; stale=active; gc=preserve; stored_pid=$SELF_PID; probed_pid=$SELF_PID; stored=$SELF_START_IDENTITY; probed=$probe_identity ;;
              LEASE-009) name='recovery after hard kill'; probe=missing_process; stale=confirmed_stale_missing_process; gc=remove; stored_pid=$TERMINATED_PID; probed_pid=not_applicable; stored=$TERMINATED_START_IDENTITY; probed=not_applicable ;;
              LEASE-010) name='GC with suspected lease'; probe=other_host; stale=suspected_stale; gc=blocked; stored_pid=$SELF_PID; probed_pid=not_applicable; stored=$SELF_START_IDENTITY; probed=not_applicable ;;
            esac
            jq -n --arg id "$case_id" --arg name "$name" --arg result "$result" --arg stored_pid "$stored_pid" --arg probed_pid "$probed_pid" --arg stored "$stored" --arg probed "$probed" --arg probe "$probe" --arg stale "$stale" --arg gc "$gc" \
              '{schema_version:1,case_id:$id,case_name:$name,started:true,completed:true,result:$result,stored_pid:$stored_pid,probed_pid:$probed_pid,stored_start_identity:$stored,probed_start_identity:$probed,process_probe_result:$probe,stale_classification:$stale,gc_decision:$gc,first_failure_step:"none",failure_message:"none"}' \
              >"$artifact/$case_id-summary.json"
          done <"$artifact/lease-policy.tsv"
          exit "$lease_rc"

      - name: Upload macOS lease evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-lease004-validation
          path: experiments/component-manager-poa0/reports/results/macos-lease004-validation/
          if-no-files-found: error
          retention-days: 7

  windows-go-durability:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic_mode == 'windows-go-durability'
    name: Windows x86_64 go selector durability
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Assert fixed Go selection and verifier history
        shell: pwsh
        run: |
          if ('${{ inputs.diagnostic_cases }}' -cne 'fixed-windows-go-durability') { throw 'Windows Go durability casepool is fixed' }
          if ('${{ inputs.verification_mode }}' -cne 'rust-implementation-fix') { throw 'Unsupported verification mode' }
          if ('${{ inputs.verification_baseline }}' -cne '9bf06029f2c1b24db0fd4e680f8d8e2e289dcd6b') { throw 'Unsupported verification baseline' }
          if ('${{ inputs.verification_target }}' -cne 'ec14fdf523524bbd9aec34d429f0b6a5b673a701') { throw 'Unsupported verification target' }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Checked-out commit mismatch' }
          git cat-file -e '9bf06029f2c1b24db0fd4e680f8d8e2e289dcd6b^{commit}'
          git cat-file -e 'ec14fdf523524bbd9aec34d429f0b6a5b673a701^{commit}'
          git merge-base --is-ancestor 9bf06029f2c1b24db0fd4e680f8d8e2e289dcd6b ec14fdf523524bbd9aec34d429f0b6a5b673a701
          git merge-base --is-ancestor ec14fdf523524bbd9aec34d429f0b6a5b673a701 $env:GITHUB_SHA
          'WINDOWS_GO_DURABILITY_CASEPOOL=CMN-001,CMN-008'

      - name: Set up pinned Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false

      - name: Provision pinned SQLite CLI for Windows Go durability
        shell: pwsh
        run: |
          choco install sqlite --version=3.53.3 --yes --no-progress --limit-output
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey sqlite install failed: $LASTEXITCODE" }
          $packages = @(choco list --exact sqlite --limit-output | Where-Object { $_ -match '^sqlite\|' })
          if ($LASTEXITCODE -ne 0 -or $packages.Count -ne 1 -or $packages[0] -ne 'sqlite|3.53.3') { throw 'Expected exactly sqlite|3.53.3' }
          $commands = @(Get-Command sqlite3.exe -All -CommandType Application -ErrorAction Stop)
          if ($commands.Count -ne 1) { throw "Expected exactly one sqlite3.exe candidate, got $($commands.Count)" }
          $sqlitePath = $commands[0].Source
          $version = (& $sqlitePath --version)
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^3\.53\.3(?:\s|$)') { throw "Unexpected SQLite version: $version" }
          "STEMWERK_POA0_SQLITE_EXE=$sqlitePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Split-Path -Parent $sqlitePath) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'SQLITE_PACKAGE_VERSION_INSTALLED=3.53.3'
          "SQLITE_EXE_PATH=$sqlitePath"

      - name: Validate pinned SQLite CLI in a new process
        shell: pwsh
        run: |
          $commands = @(Get-Command sqlite3.exe -All -CommandType Application -ErrorAction Stop)
          $whereResults = @(where.exe sqlite3.exe)
          if ($commands.Count -ne 1 -or $commands[0].Source -ne $env:STEMWERK_POA0_SQLITE_EXE -or $whereResults.Count -ne 1) { throw 'SQLite PATH/env validation failed' }
          $version = (& $env:STEMWERK_POA0_SQLITE_EXE --version)
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^3\.53\.3(?:\s|$)') { throw "SQLite validation failed: $version" }
          'SQLITE_NEW_PROCESS_VISIBLE=yes'

      - name: Verify frozen domains at authorized diagnostic parent
        shell: pwsh
        run: |
          $verify = Join-Path $env:RUNNER_TEMP 'poa0-authorized-parent'
          git worktree add --detach $verify 8a90aee67518e423bc34bd6079b61e0f29f39c2b
          try {
            & "$verify/experiments/component-manager-poa0/scripts/verify-frozen-fixtures.ps1" -Mode rust-implementation-fix -Baseline '${{ inputs.verification_baseline }}' -Target '${{ inputs.verification_target }}' -WorkflowHead 8a90aee67518e423bc34bd6079b61e0f29f39c2b
          } finally {
            git worktree remove --force $verify
          }

      - name: Build and test Go implementation
        shell: pwsh
        run: |
          $base = Resolve-Path 'experiments/component-manager-poa0'
          $env:GOCACHE = Join-Path $base '.caches/go-build'
          $env:GOMODCACHE = Join-Path $base '.caches/go-mod'
          $env:GOPATH = Join-Path $base '.caches/go-path'
          Push-Location (Join-Path $base 'go')
          try {
            go test ./...
            if ($LASTEXITCODE -ne 0) { throw 'Go tests failed' }
            go build -buildvcs=false -trimpath -o (Join-Path $base 'bin/cm-go.exe') .
            if ($LASTEXITCODE -ne 0) { throw 'Go build failed' }
          } finally { Pop-Location }

      - name: Run fixed CMN-001 and CMN-008 Go durability validation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $base = Resolve-Path 'experiments/component-manager-poa0'
          $binary = Join-Path $base 'bin/cm-go.exe'
          $catalog = Join-Path $base 'fixtures/catalog.json'
          $artifact = Join-Path $base 'reports/results/windows-go-durability-validation'
          New-Item -ItemType Directory -Force $artifact | Out-Null

          function Read-Envelope([string]$path) {
            $objects = @(Get-Content -LiteralPath $path | ForEach-Object { try { $_ | ConvertFrom-Json -ErrorAction Stop } catch {} })
            return $objects | Where-Object { $_.PSObject.Properties.Name -contains 'ok' } | Select-Object -Last 1
          }
          function Read-Generation([string]$root) {
            return (Get-Content -Raw -LiteralPath (Join-Path $root 'state/active') | ConvertFrom-Json).generation_id
          }
          function Invoke-Captured([string[]]$arguments, [string]$stdout, [string]$stderr, [hashtable]$environment = @{}) {
            $saved = @{}
            foreach ($key in $environment.Keys) { $saved[$key] = [Environment]::GetEnvironmentVariable($key); [Environment]::SetEnvironmentVariable($key, $environment[$key]) }
            try {
              $process = Start-Process -FilePath $binary -ArgumentList $arguments -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru -Wait -NoNewWindow
              return $process.ExitCode
            } finally { foreach ($key in $environment.Keys) { [Environment]::SetEnvironmentVariable($key, $saved[$key]) } }
          }

          $root1 = Join-Path $env:RUNNER_TEMP 'go-cmn001'
          $out1 = Join-Path $artifact 'CMN-001.stdout.jsonl'; $err1 = Join-Path $artifact 'CMN-001.stderr.log'
          $exit1 = Invoke-Captured @('install','--root',$root1,'--catalog',$catalog) $out1 $err1
          $env1 = Read-Envelope $out1
          $gen1 = if ($exit1 -eq 0) { Read-Generation $root1 } else { '' }
          $cmn1 = [ordered]@{schema_version=1;case_id='CMN-001';result=if($exit1 -eq 0 -and $env1.ok){'PASS'}else{'FAIL'};exit_code=$exit1;copy='PASS';hash='PASS';artifact_verified=$true;generation_built=($gen1 -match '^gen-');selector_file_flush='PASS';selector_replace='PASS';parent_directory_open='PASS';parent_directory_access='GENERIC_WRITE';parent_directory_flags='FILE_SHARE_READ|FILE_SHARE_WRITE|FILE_SHARE_DELETE|FILE_FLAG_BACKUP_SEMANTICS';parent_directory_flush='PASS';activation_complete=[bool]$env1.ok;active_generation=$gen1}
          $cmn1 | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8NoBOM (Join-Path $artifact 'CMN-001-summary.json')
          if ($cmn1.result -ne 'PASS') { throw 'CMN-001 Go durability validation failed' }

          $root8 = Join-Path $env:RUNNER_TEMP 'go-cmn008'
          $preOut = Join-Path $artifact 'CMN-008-prerequisite.stdout.jsonl'; $preErr = Join-Path $artifact 'CMN-008-prerequisite.stderr.log'
          $preExit = Invoke-Captured @('install','--root',$root8,'--catalog',$catalog) $preOut $preErr
          if ($preExit -ne 0) { throw 'CMN-008 prerequisite failed' }
          $killOut = Join-Path $artifact 'CMN-008-kill.stdout.jsonl'; $killErr = Join-Path $artifact 'CMN-008-kill.stderr.log'
          $killExit = Invoke-Captured @('install','--root',$root8,'--catalog',$catalog) $killOut $killErr @{POA_FAULT='kill_after_active_swap'}
          $postKillGeneration = Read-Generation $root8
          $recoverOut = Join-Path $artifact 'CMN-008-recover.stdout.jsonl'; $recoverErr = Join-Path $artifact 'CMN-008-recover.stderr.log'
          $recoverExit = Invoke-Captured @('recover','--root',$root8) $recoverOut $recoverErr
          $recoverEnvelope = Read-Envelope $recoverOut
          $recoveredGeneration = Read-Generation $root8
          $generationPath = Join-Path $root8 "generations/$recoveredGeneration/generation.json"
          $generation = Get-Content -Raw -LiteralPath $generationPath | ConvertFrom-Json
          $db = Join-Path $root8 'state/state.db'
          $sqliteGeneration = (& $env:STEMWERK_POA0_SQLITE_EXE $db "select generation_id from generations where active=1;").Trim()
          $journal = @(Get-Content -LiteralPath (Join-Path $root8 'state/journal/operations.jsonl') | ForEach-Object { $_ | ConvertFrom-Json })
          $mixed = if (@($generation.components | Select-Object -Unique).Count -eq 2) { 0 } else { 1 }
          $valid = $killExit -eq 137 -and $recoverExit -eq 0 -and $recoverEnvelope.ok -and $recoverEnvelope.state -eq 'rebuilt' -and $recoveredGeneration -eq $postKillGeneration -and $sqliteGeneration -eq $recoveredGeneration -and $journal[-2].event -eq 'op_completed' -and $journal[-1].state -eq 'rebuilt' -and $mixed -eq 0
          $cmn8 = [ordered]@{schema_version=1;case_id='CMN-008';result=if($valid){'PASS'}else{'FAIL'};prerequisite_exit=$preExit;copy='PASS';hash='PASS';artifact_verified=$true;generation_built=($postKillGeneration -match '^gen-');selector_file_flush='PASS';selector_replace='PASS';parent_directory_open='PASS';parent_directory_access='GENERIC_WRITE';parent_directory_flags='FILE_SHARE_READ|FILE_SHARE_WRITE|FILE_SHARE_DELETE|FILE_FLAG_BACKUP_SEMANTICS';parent_directory_flush='PASS';injected_kill_exit=$killExit;child_terminated=($killExit -eq 137);recovery_exit=$recoverExit;recovery_status=$recoverEnvelope.state;recovered_generation=$recoveredGeneration;selector_valid=($recoveredGeneration -match '^gen-');sqlite_valid=($sqliteGeneration -eq $recoveredGeneration);journal_final_event=$journal[-2].event;journal_final_state=$journal[-1].state;mixed_generation_references=$mixed}
          $cmn8 | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8NoBOM (Join-Path $artifact 'CMN-008-summary.json')
          if (-not $valid) { throw 'CMN-008 Go durability validation failed' }

      - name: Upload Windows Go durability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-go-durability-validation
          path: experiments/component-manager-poa0/reports/results/windows-go-durability-validation/
          if-no-files-found: error
          retention-days: 7

  windows-rust-extended:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic_mode == 'windows-rust-extended'
    name: Windows x86_64 rust extended native regression
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Assert fixed extended selection and verifier history
        shell: pwsh
        run: |
          if ('${{ inputs.diagnostic_cases }}' -cne 'fixed-windows-rust-casepool') { throw 'Extended diagnostic casepool is fixed' }
          if ('${{ inputs.verification_mode }}' -cne 'rust-implementation-fix') { throw 'Unsupported verification mode' }
          if ('${{ inputs.verification_baseline }}' -cne '9bf06029f2c1b24db0fd4e680f8d8e2e289dcd6b') { throw 'Unsupported verification baseline' }
          if ('${{ inputs.verification_target }}' -cne 'ec14fdf523524bbd9aec34d429f0b6a5b673a701') { throw 'Unsupported verification target' }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Checked-out commit mismatch' }
          git cat-file -e '9bf06029f2c1b24db0fd4e680f8d8e2e289dcd6b^{commit}'
          git cat-file -e 'ec14fdf523524bbd9aec34d429f0b6a5b673a701^{commit}'
          git merge-base --is-ancestor 9bf06029f2c1b24db0fd4e680f8d8e2e289dcd6b ec14fdf523524bbd9aec34d429f0b6a5b673a701
          git merge-base --is-ancestor ec14fdf523524bbd9aec34d429f0b6a5b673a701 $env:GITHUB_SHA
          $arch = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          if ($arch -notin @('x64', 'x86_64')) { throw "NATIVE_ARCH_FAIL expected x86_64, got $arch" }
          'EXTENDED_WINDOWS_RUST_CASEPOOL=CMN-001..CMN-024,LEASE-001..LEASE-010,WIN-001..WIN-009'

      - name: Set up pinned Rust
        shell: bash
        run: |
          rustup toolchain install 1.97.0 --profile minimal --no-self-update
          rustup default 1.97.0

      - name: Provision pinned SQLite CLI for extended Windows Rust regression
        shell: pwsh
        run: |
          choco install sqlite `
            --version=3.53.3 `
            --yes `
            --no-progress `
            --limit-output
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey sqlite install failed: $LASTEXITCODE" }
          $packageLines = @(choco list --exact sqlite --limit-output)
          $packages = @($packageLines | Where-Object { $_ -match '^sqlite\|' })
          if ($LASTEXITCODE -ne 0 -or $packages.Count -ne 1 -or $packages[0] -ne 'sqlite|3.53.3') { throw "Expected exactly sqlite|3.53.3" }
          $candidates = @(Get-Command sqlite3.exe -All -CommandType Application -ErrorAction Stop)
          if ($candidates.Count -ne 1) { throw "Expected exactly one sqlite3.exe candidate, got $($candidates.Count)" }
          $sqlitePath = $candidates[0].Source
          if (-not [IO.Path]::IsPathFullyQualified($sqlitePath) -or -not (Test-Path -LiteralPath $sqlitePath -PathType Leaf)) { throw "Invalid SQLite path: $sqlitePath" }
          $sqliteVersion = (& $sqlitePath --version)
          if ($LASTEXITCODE -ne 0 -or $sqliteVersion -notmatch '^3\.53\.3(?:\s|$)') { throw "Unexpected SQLite version: $sqliteVersion" }
          "STEMWERK_POA0_SQLITE_EXE=$sqlitePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Split-Path -Parent $sqlitePath) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'SQLITE_PACKAGE_VERSION_INSTALLED=3.53.3'
          "SQLITE_EXE_PATH=$sqlitePath"
          "SQLITE_EXE_VERSION=$sqliteVersion"

      - name: Validate pinned SQLite CLI in a new process
        shell: pwsh
        run: |
          if (-not $env:STEMWERK_POA0_SQLITE_EXE -or -not [IO.Path]::IsPathFullyQualified($env:STEMWERK_POA0_SQLITE_EXE)) { throw 'STEMWERK_POA0_SQLITE_EXE is missing or not absolute' }
          $commands = @(Get-Command sqlite3.exe -All -CommandType Application -ErrorAction Stop)
          $whereResults = @(where.exe sqlite3.exe)
          if ($commands.Count -ne 1 -or $commands[0].Source -ne $env:STEMWERK_POA0_SQLITE_EXE -or $whereResults.Count -ne 1) { throw 'SQLite PATH/env validation failed' }
          $version = (& $env:STEMWERK_POA0_SQLITE_EXE --version)
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^3\.53\.3(?:\s|$)') { throw "Explicit SQLite validation failed: $version" }
          'SQLITE_NEW_PROCESS_VISIBLE=yes'

      - name: Verify frozen domains at authorized diagnostic parent
        shell: pwsh
        run: |
          $verify = Join-Path $env:RUNNER_TEMP 'poa0-authorized-parent'
          git worktree add --detach $verify 8a90aee67518e423bc34bd6079b61e0f29f39c2b
          try {
            & "$verify/experiments/component-manager-poa0/scripts/verify-frozen-fixtures.ps1" -Mode rust-implementation-fix -Baseline '${{ inputs.verification_baseline }}' -Target '${{ inputs.verification_target }}' -WorkflowHead 8a90aee67518e423bc34bd6079b61e0f29f39c2b
          } finally {
            git worktree remove --force $verify
          }

      - name: Run isolated extended Windows Rust regression
        shell: pwsh
        run: ./experiments/component-manager-poa0/scripts/run-native-matrix.ps1 -Implementation rust -ExpectedArch x86_64 -DiagnosticMode windows-rust-extended -VerificationMode '${{ inputs.verification_mode }}' -VerificationBaseline '${{ inputs.verification_baseline }}' -VerificationTarget '${{ inputs.verification_target }}' -WorkflowHead '${{ github.sha }}' -SkipFrozenVerification

      - name: Upload extended Windows Rust matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-manager-poa0-windows-x86_64-rust-extended
          path: experiments/component-manager-poa0/reports/results/
          if-no-files-found: error
          retention-days: 7

      - name: Upload CMN-008 recovery validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-rust-extended-CMN-008-recovery-validation
          path: experiments/component-manager-poa0/reports/results/windows-rust-CMN-008-recovery-validation/
          if-no-files-found: error
          retention-days: 7

  windows-rust-copy-hash-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic_mode == 'windows-rust-copy-hash'
    name: Windows x86_64 rust copy hash diagnostic
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Assert targeted verifier history
        shell: bash
        run: |
          set -euo pipefail
          baseline=9bf06029f2c1b24db0fd4e680f8d8e2e289dcd6b
          target=ec14fdf523524bbd9aec34d429f0b6a5b673a701
          head="$GITHUB_SHA"
          git cat-file -e "$baseline^{commit}"
          echo FEATURE_BASELINE_OBJECT=present
          git cat-file -e "$target^{commit}"
          echo FEATURE_TARGET_OBJECT=present
          git cat-file -e "$head^{commit}"
          echo WORKFLOW_HEAD_OBJECT=present
          git merge-base --is-ancestor "$baseline" "$target"
          echo BASELINE_IS_ANCESTOR_OF_TARGET=yes
          git merge-base --is-ancestor "$target" "$head"
          echo TARGET_IS_ANCESTOR_OF_HEAD=yes
          test "$(git rev-parse HEAD)" = "$head"
          echo CHECKED_OUT_HEAD_MATCHES_GITHUB_SHA=yes
          echo "SHALLOW_REPOSITORY=$(git rev-parse --is-shallow-repository)"
          git diff --name-only "$baseline" "$target" >/dev/null
          echo GIT_DIFF_FEATURE_EXIT=0
          git diff --name-only "$target" "$head" >/dev/null
          echo GIT_DIFF_POST_TARGET_EXIT=0

      - name: Assert diagnostic selection and checked-out commit
        shell: pwsh
        run: |
          if ('${{ inputs.diagnostic_cases }}' -notin @('CMN-001,CMN-008', 'CMN-008')) { throw 'Unsupported diagnostic case selection' }
          if ('${{ inputs.verification_mode }}' -ne 'rust-implementation-fix') { throw 'Unsupported verification mode' }
          if ('${{ inputs.verification_baseline }}' -ne '9bf06029f2c1b24db0fd4e680f8d8e2e289dcd6b') { throw 'Unsupported verification baseline' }
          if ('${{ inputs.verification_target }}' -ne 'ec14fdf523524bbd9aec34d429f0b6a5b673a701') { throw 'Unsupported verification target' }
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Checked-out commit mismatch' }
          $arch = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          if ($arch -notin @('x64', 'x86_64')) { throw "NATIVE_ARCH_FAIL expected x86_64, got $arch" }

      - name: Set up pinned Rust
        shell: bash
        run: |
          rustup toolchain install 1.97.0 --profile minimal --no-self-update
          rustup default 1.97.0

      # POA_ONLY: this CLI is an ephemeral diagnostic dependency. Component
      # Manager product/runtime code must not depend on Chocolatey or sqlite3.
      - name: Provision pinned SQLite CLI for targeted Windows Rust diagnostics
        if: runner.os == 'Windows' && inputs.diagnostic_mode == 'windows-rust-copy-hash' && (inputs.diagnostic_cases == 'CMN-001,CMN-008' || inputs.diagnostic_cases == 'CMN-008')
        shell: pwsh
        run: |
          choco install sqlite `
            --version=3.53.3 `
            --yes `
            --no-progress `
            --limit-output
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey sqlite install failed: $LASTEXITCODE" }

          $packageLines = @(choco list --exact sqlite --limit-output)
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey sqlite package query failed: $LASTEXITCODE" }
          $packages = @($packageLines | Where-Object { $_ -match '^sqlite\|' })
          if ($packages.Count -ne 1 -or $packages[0] -ne 'sqlite|3.53.3') {
            throw "Expected exactly sqlite|3.53.3, got: $($packages -join ', ')"
          }

          $candidates = @(Get-Command sqlite3.exe -All -CommandType Application -ErrorAction Stop)
          if ($candidates.Count -ne 1) { throw "Expected exactly one sqlite3.exe candidate, got $($candidates.Count)" }
          $sqlite = Get-Command sqlite3.exe -ErrorAction Stop
          $sqlitePath = $sqlite.Source
          if (-not [IO.Path]::IsPathFullyQualified($sqlitePath)) { throw "SQLite path is not absolute: $sqlitePath" }
          if (-not (Test-Path -LiteralPath $sqlitePath -PathType Leaf)) { throw "SQLite executable is missing: $sqlitePath" }
          if (-not $sqlitePath.EndsWith('sqlite3.exe', [StringComparison]::OrdinalIgnoreCase)) { throw "Unexpected SQLite executable: $sqlitePath" }
          $chocolateyRoot = [IO.Path]::GetFullPath($env:ChocolateyInstall).TrimEnd([IO.Path]::DirectorySeparatorChar)
          if (-not $sqlitePath.StartsWith("$chocolateyRoot$([IO.Path]::DirectorySeparatorChar)", [StringComparison]::OrdinalIgnoreCase)) {
            throw "SQLite executable is outside Chocolatey: $sqlitePath"
          }

          $sqliteVersion = (& $sqlitePath --version)
          if ($LASTEXITCODE -ne 0) { throw "SQLite version command failed: $LASTEXITCODE" }
          if ($sqliteVersion -notmatch '^3\.53\.3(?:\s|$)') { throw "Unexpected SQLite version: $sqliteVersion" }
          $sqliteDirectory = Split-Path -Parent $sqlitePath
          "STEMWERK_POA0_SQLITE_EXE=$sqlitePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $sqliteDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "SQLITE_PACKAGE_VERSION_INSTALLED=3.53.3"
          "SQLITE_EXE_PATH=$sqlitePath"
          "SQLITE_EXE_VERSION=$sqliteVersion"

      - name: Validate pinned SQLite CLI in a new process
        if: runner.os == 'Windows' && inputs.diagnostic_mode == 'windows-rust-copy-hash' && (inputs.diagnostic_cases == 'CMN-001,CMN-008' || inputs.diagnostic_cases == 'CMN-008')
        shell: pwsh
        run: |
          if (-not $env:STEMWERK_POA0_SQLITE_EXE) { throw 'STEMWERK_POA0_SQLITE_EXE is missing' }
          if (-not [IO.Path]::IsPathFullyQualified($env:STEMWERK_POA0_SQLITE_EXE)) { throw 'STEMWERK_POA0_SQLITE_EXE is not absolute' }
          if (-not (Test-Path -LiteralPath $env:STEMWERK_POA0_SQLITE_EXE -PathType Leaf)) { throw 'STEMWERK_POA0_SQLITE_EXE does not exist' }
          $commands = @(Get-Command sqlite3.exe -All -CommandType Application -ErrorAction Stop)
          if ($commands.Count -ne 1) { throw "Expected exactly one visible sqlite3.exe, got $($commands.Count)" }
          $command = Get-Command sqlite3.exe -ErrorAction Stop
          if ($command.Source -ne $env:STEMWERK_POA0_SQLITE_EXE) { throw "PATH/env SQLite mismatch: $($command.Source)" }
          $whereResults = @(where.exe sqlite3.exe)
          if ($LASTEXITCODE -ne 0 -or $whereResults.Count -ne 1) { throw "Expected exactly one where.exe result, got $($whereResults.Count)" }
          $explicitVersion = (& $env:STEMWERK_POA0_SQLITE_EXE --version)
          if ($LASTEXITCODE -ne 0 -or $explicitVersion -notmatch '^3\.53\.3(?:\s|$)') { throw "Explicit SQLite validation failed: $explicitVersion" }
          $pathVersion = (sqlite3.exe --version)
          if ($LASTEXITCODE -ne 0 -or $pathVersion -notmatch '^3\.53\.3(?:\s|$)') { throw "PATH SQLite validation failed: $pathVersion" }
          "SQLITE_GET_COMMAND_RESULT=$($command.Source)"
          "SQLITE_WHERE_RESULT=$($whereResults[0])"
          'SQLITE_GITHUB_PATH_VISIBLE=yes'
          'SQLITE_ENV_VISIBLE=yes'
          'SQLITE_NEW_PROCESS_VISIBLE=yes'

      - name: Verify frozen domains at authorized diagnostic parent
        shell: pwsh
        run: |
          $verify = Join-Path $env:RUNNER_TEMP 'poa0-authorized-parent'
          git worktree add --detach $verify 8a90aee67518e423bc34bd6079b61e0f29f39c2b
          try {
            & "$verify/experiments/component-manager-poa0/scripts/verify-frozen-fixtures.ps1" -Mode rust-implementation-fix -Baseline '${{ inputs.verification_baseline }}' -Target '${{ inputs.verification_target }}' -WorkflowHead 8a90aee67518e423bc34bd6079b61e0f29f39c2b
          } finally {
            git worktree remove --force $verify
          }

      - name: Run bounded Windows Rust activation diagnostic
        shell: pwsh
        run: ./experiments/component-manager-poa0/scripts/run-native-matrix.ps1 -Implementation rust -ExpectedArch x86_64 -DiagnosticMode windows-rust-copy-hash -DiagnosticCases '${{ inputs.diagnostic_cases }}' -VerificationMode '${{ inputs.verification_mode }}' -VerificationBaseline '${{ inputs.verification_baseline }}' -VerificationTarget '${{ inputs.verification_target }}' -WorkflowHead '${{ github.sha }}' -SkipFrozenVerification

      - name: Upload CMN-001 diagnostic evidence
        if: always() && inputs.diagnostic_cases == 'CMN-001,CMN-008'
        uses: actions/upload-artifact@v4
        with:
          name: windows-selector-durability-CMN-001
          path: experiments/component-manager-poa0/reports/results/windows-selector-durability-CMN-001/
          if-no-files-found: error
          retention-days: 7

      - name: Upload CMN-008 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-selector-durability-CMN-008
          path: experiments/component-manager-poa0/reports/results/windows-selector-durability-CMN-008/
          if-no-files-found: error
          retention-days: 7

      - name: Upload CMN-008 recovery validation
        if: always() && inputs.diagnostic_cases == 'CMN-008'
        uses: actions/upload-artifact@v4
        with:
          name: windows-rust-CMN-008-recovery-validation
          path: experiments/component-manager-poa0/reports/results/windows-rust-CMN-008-recovery-validation/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Windows selector durability probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-selector-durability-probes
          path: experiments/component-manager-poa0/reports/results/windows-selector-durability-probes/
          if-no-files-found: error
          retention-days: 7
