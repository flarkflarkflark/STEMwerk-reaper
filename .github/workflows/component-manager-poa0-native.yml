name: Component Manager POA-0 Native

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/component-manager-poa0
    paths:
      - experiments/component-manager-poa0/**
      - .github/workflows/component-manager-poa0-native.yml

permissions:
  contents: read

concurrency:
  group: component-manager-poa0-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: ${{ matrix.label }} ${{ matrix.implementation }} native
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            runner: ubuntu-latest
            os: linux
            arch: x86_64
            implementation: rust
          - label: Linux x86_64
            runner: ubuntu-latest
            os: linux
            arch: x86_64
            implementation: go
          - label: Windows x86_64
            runner: windows-latest
            os: windows
            arch: x86_64
            implementation: rust
          - label: Windows x86_64
            runner: windows-latest
            os: windows
            arch: x86_64
            implementation: go
          - label: macOS Intel x86_64
            runner: macos-15-intel
            os: macos
            arch: x86_64
            implementation: rust
          - label: macOS Intel x86_64
            runner: macos-15-intel
            os: macos
            arch: x86_64
            implementation: go
          - label: macOS Apple Silicon arm64
            runner: macos-15
            os: macos
            arch: arm64
            implementation: rust
          - label: macOS Apple Silicon arm64
            runner: macos-15
            os: macos
            arch: arm64
            implementation: go
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Assert checked-out commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Assert Unix native architecture and executable mode
        if: matrix.os != 'windows'
        shell: bash
        run: |
          test "$(uname -s)" = "${{ matrix.os == 'linux' && 'Linux' || 'Darwin' }}"
          test "$(uname -m)" = "${{ matrix.arch }}"
          test -x experiments/component-manager-poa0/scripts/run-native-matrix.sh

      - name: Assert Windows native architecture
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $arch = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          if ($arch -notin @('x64', 'x86_64')) { throw "NATIVE_ARCH_FAIL expected x86_64, got $arch" }

      - name: Set up pinned Go
        if: matrix.implementation == 'go'
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false

      - name: Set up pinned Rust
        if: matrix.implementation == 'rust'
        shell: bash
        run: |
          rustup toolchain install 1.97.0 --profile minimal --no-self-update
          rustup default 1.97.0

      # POA_ONLY: production core must use embedded/native SQLite and must not
      # depend on Chocolatey or an external sqlite3 executable.
      - name: Provision pinned SQLite CLI for Windows POA
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          choco install sqlite --version=3.53.3 --yes --no-progress --limit-output
          if ($LASTEXITCODE -notin @(0, 3010)) { throw "Chocolatey sqlite install failed: $LASTEXITCODE" }
          where.exe sqlite3
          sqlite3 --version

      - name: Run frozen native matrix on Unix
        if: matrix.os != 'windows'
        shell: bash
        env:
          POA_EXPECTED_OS: ${{ matrix.os }}
          POA_EXPECTED_ARCH: ${{ matrix.arch }}
        run: experiments/component-manager-poa0/scripts/run-native-matrix.sh --implementation "${{ matrix.implementation }}"

      - name: Run frozen native matrix on Windows
        if: matrix.os == 'windows'
        shell: pwsh
        run: ./experiments/component-manager-poa0/scripts/run-native-matrix.ps1 -Implementation '${{ matrix.implementation }}' -ExpectedArch '${{ matrix.arch }}'

      - name: Upload small POA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-manager-poa0-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.implementation }}
          path: |
            experiments/component-manager-poa0/reports/results/
            experiments/component-manager-poa0/reports/NATIVE_MATRIX_RESULTS.md
          if-no-files-found: error
          retention-days: 7
