name: Managed Python pin check

on:
  schedule:
    - cron: '17 6 * * 1'

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check pinned vendor URLs, sizes, hashes and broken-pin rejection
        run: python tools/check_managed_python_pins.py
